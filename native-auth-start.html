<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex,nofollow" />
<title>Opening Google sign-in</title>
<style>
  :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fa;color:#1c2024}
  *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(420px,100%);background:#fff;border:1px solid #e4e7eb;border-radius:18px;padding:28px;box-shadow:0 16px 45px rgba(25,30,35,.08)}h1{margin:0 0 8px;font-size:22px;letter-spacing:-.02em}p{margin:0;color:#626b74;line-height:1.5}a{display:block;margin-top:22px;padding:12px 16px;border-radius:10px;background:#1f6f50;color:#fff;text-decoration:none;font-weight:700;text-align:center}[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Opening Google sign-in</h1>
  <p id="status">Preparing a secure Diet Copilot sign-in…</p>
  <a id="continue" hidden href="#">Continue</a>
</main>
<script>
(() => {
  const TARGET_KEY='diet-copilot:oauth-target-v2';
  const FLOW_KEY='diet-copilot:oauth-flow-v2';
  const status=document.getElementById('status');
  const button=document.getElementById('continue');
  const params=new URLSearchParams(location.hash.slice(1));
  const raw=params.get('auth_url');
  const flowId=params.get('flow_id')||'';
  let authUrl;
  try{authUrl=new URL(raw||'')}catch{}

  if(!authUrl||authUrl.origin!=='https://hycegznamzjhwinegaai.supabase.co'||authUrl.pathname!=='/auth/v1/authorize'){
    status.textContent='The sign-in request is invalid. Return to Diet Copilot and try again.';
    return;
  }

  try{
    sessionStorage.setItem(TARGET_KEY,'native');
    if(flowId)sessionStorage.setItem(FLOW_KEY,flowId);else sessionStorage.removeItem(FLOW_KEY);
  }catch{}

  try{history.replaceState(null,'',location.pathname)}catch{}
  button.href=authUrl.toString();
  button.hidden=false;
  try{location.replace(authUrl.toString())}catch{}
})();
</script>
</body>
</html>
