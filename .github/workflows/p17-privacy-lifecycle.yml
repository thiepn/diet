name: P17 Production Privacy & Lifecycle
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'index.html'
      - 'sw.js'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - '.well-known/**'
      - 'tests/p17-*'
      - 'docs/P17-*'
      - '.github/workflows/p17-privacy-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p17-production-privacy
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: P17 privacy and lifecycle contract
        run: |
          node tests/p17-privacy-lifecycle-contract.mjs
          python -m py_compile tests/p17-public-export-probe.py

  public-boundary:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify anonymous client cannot export Diet owner data
        run: python tests/p17-public-export-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p17-public-export
          path: p17-public-export.json
          retention-days: 14
