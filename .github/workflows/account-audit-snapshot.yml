name: Account audit snapshot
on:
  push:
    branches: [fix/account-release-final]
    paths: [.github/workflows/account-audit-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export tracked source and exact production SDK
        run: |
          mkdir -p /tmp/diet-audit
          git archive --format=tar HEAD > /tmp/diet-audit/source.tar
          curl --fail --location --retry 2 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0' -o /tmp/diet-audit/supabase.js
          sha256sum /tmp/diet-audit/supabase.js > /tmp/diet-audit/sdk-sha256.txt
          git rev-parse HEAD > /tmp/diet-audit/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diet-account-audit-workspace
          path: /tmp/diet-audit/
          retention-days: 2
