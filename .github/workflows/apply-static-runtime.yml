name: Apply static Diet runtime bundles

on:
  push:
    paths:
      - '.github/workflows/apply-static-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build certified expanded runtime
        run: |
          set -euo pipefail
          node scripts/build-v68.mjs
          node tests/policy.mjs
          node tests/release.mjs
      - name: Replace Liquid runtime templates with static assets
        run: |
          set -euo pipefail
          cp .v68-build/diet-app.js diet-app.js
          cp .v68-build/diet.css diet.css
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('diet.css?v=1.0.2','diet.css?v=1.0.2-static1')
          s=s.replace('diet-app.js?v=1.0.2','diet-app.js?v=1.0.2-static1')
          p.write_text(s)
          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("diet-copilot-web-v1.0.2'","diet-copilot-web-v1.0.2-static1'")
          s=s.replace("diet.css?v=1.0.2'","diet.css?v=1.0.2-static1'")
          s=s.replace("diet-app.js?v=1.0.2'","diet-app.js?v=1.0.2-static1'")
          p.write_text(s)
          PY
          rm -f .github/workflows/export-expanded-bundles.yml
          rm -f .github/workflows/apply-static-runtime.yml
      - name: Commit static production runtime
        run: |
          set -euo pipefail
          git config user.name 'thiepn'
          git config user.email 'junsosmart@gmail.com'
          git add -A
          git commit -m 'Fix broken Diet runtime by shipping expanded static bundles'
          git push origin HEAD:main
