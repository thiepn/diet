name: P11 Live RC Certification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p11-rc-live.yml'
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p11-live-rc
  cancel-in-progress: true

jobs:
  deployed-assets:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify exact public RC bytes
        env:
          P11_RC_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: python tests/p11-deployed-rc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p11-deployed-rc-assets
          path: p11-deployed-rc.json
          retention-days: 14

  browser:
    needs: deployed-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned browser tooling
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Certify public RC
        run: python tests/p11-live-rc.py --browser ${{ matrix.browser }} --out p11-live/${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p11-live-${{ matrix.browser }}
          path: p11-live/${{ matrix.browser }}/
          retention-days: 14
