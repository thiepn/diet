name: P41 Generation-5 Epoch Watch and Certification Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform-p25-burn-in-plan.json'
      - 'platform-p40-*.json'
      - 'platform-p41-*.json'
      - 'scripts/p41-*.py'
      - 'tests/p41-*'
      - 'docs/P41-*.md'
      - '.github/workflows/p41-generation5-epoch-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p41-generation5-epoch-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify P41 structural contract
        run: node tests/p41-certification-readiness-contract.mjs

      - name: Verify P41 fail-closed epoch watch
        run: python tests/p41-certification-readiness-contract.py

      - name: Produce current certification-readiness receipt
        run: |
          python scripts/p41-certification-readiness.py \
            platform-p41-live-epoch-observation.json \
            --out p41-current-certification-readiness.json
          python - <<'PY'
          import json
          r=json.load(open('p41-current-certification-readiness.json'))
          assert r['decision']=='blocked_epoch_changed'
          assert r['certifiable'] is False
          assert r['requiresNewGeneration'] is True
          assert r['nextGeneration']==6
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p41-generation5-epoch-watch-${{ github.run_id }}
          path: p41-current-certification-readiness.json
          if-no-files-found: error
          retention-days: 90
