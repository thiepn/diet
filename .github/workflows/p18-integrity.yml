name: P18 Production Data Integrity
on:
  push:
    branches: [main]
    paths:
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - '.well-known/thiepn-app.json'
      - 'tests/p18-*'
      - 'docs/P18-*'
      - '.github/workflows/p18-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p18-production-integrity
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: P18 integrity contract
        run: |
          node tests/p18-integrity-contract.mjs
          python -m py_compile tests/p18-public-integrity-probe.py

  public-boundary:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify publishable client cannot read global integrity report
        run: python tests/p18-public-integrity-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p18-public-integrity
          path: p18-public-integrity.json
          retention-days: 14
