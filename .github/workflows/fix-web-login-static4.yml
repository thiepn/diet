name: Fix Diet web login static4

on:
  push:
    paths:
      - '.github/workflows/fix-web-login-static4.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Remove redirect mutation and rebuild runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          persist = Path('src/auth/dashboard-auth-persist.js')
          s = persist.read_text()
          old = "        storageKey: DIET_AUTH_STORAGE_KEY,\n        experimental: { appendPkceFlowIdToRedirects: true }\n"
          new = "        storageKey: DIET_AUTH_STORAGE_KEY\n"
          if old not in s:
              raise SystemExit('Expected experimental PKCE redirect mutation not found')
          persist.write_text(s.replace(old, new, 1))
          PY

          node scripts/build-v68.mjs --write

          python - <<'PY'
          from pathlib import Path

          # Force every browser/service worker onto the corrected runtime.
          for name in ['index.html', 'sw.js', 'tests/release.mjs', '.github/workflows/ci.yml', '.github/workflows/a7-operations.yml']:
              p = Path(name)
              s = p.read_text().replace('static3', 'static4')
              p.write_text(s)

          p = Path('tests/release.mjs')
          s = p.read_text()
          old1 = "assert.ok(js.includes('appendPkceFlowIdToRedirects: true'),'Per-flow PKCE redirect IDs are missing');\n"
          new1 = "assert.ok(!js.includes('appendPkceFlowIdToRedirects: true'),'Web PKCE must not mutate redirectTo; the relay carries flowId explicitly');\nassert.ok(js.includes('data.flowId')&&js.includes(\"dietSetBrowserOAuthRelayState('web'\"),'Web PKCE flow id relay is missing');\n"
          old2 = "assert.ok(persist.includes('appendPkceFlowIdToRedirects: true'),'Canonical Diet auth client must append the PKCE flow id');\n"
          new2 = "assert.ok(!persist.includes('appendPkceFlowIdToRedirects: true'),'Canonical Diet auth client must not mutate redirectTo with sb_flow_id');\nassert.ok(auth.includes('data.flowId')&&auth.includes(\"dietSetBrowserOAuthRelayState('web'\"),'Canonical web flow must carry flowId through same-origin relay state');\n"
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected release PKCE assertions not found')
          p.write_text(s.replace(old1, new1, 1).replace(old2, new2, 1))

          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = "          if(!persist.includes('appendPkceFlowIdToRedirects: true'))throw new Error('Per-flow PKCE redirect IDs are missing.');\n"
          new = "          if(persist.includes('appendPkceFlowIdToRedirects: true'))throw new Error('Web PKCE must not mutate redirectTo with sb_flow_id.');\n          if(!auth.includes('data.flowId')||!auth.includes(\"dietSetBrowserOAuthRelayState('web'\"))throw new Error('Web PKCE flow id relay is missing.');\n"
          oldgrep = "          grep -q 'appendPkceFlowIdToRedirects: true' _site/diet-app.js\n"
          newgrep = "          ! grep -q 'appendPkceFlowIdToRedirects: true' _site/diet-app.js\n          grep -q 'data.flowId' _site/diet-app.js\n"
          if old not in s or oldgrep not in s:
              raise SystemExit('Expected CI PKCE assertions not found')
          p.write_text(s.replace(old, new, 1).replace(oldgrep, newgrep, 1))
          PY

          node --check diet-app.js
          node scripts/build-v68.mjs
          node tests/release.mjs
          ! grep -q 'appendPkceFlowIdToRedirects: true' src/auth/dashboard-auth-persist.js
          ! grep -q 'appendPkceFlowIdToRedirects: true' diet-app.js
          grep -q 'data.flowId' src/auth/dashboard-auth.js
          grep -q 'diet-app.js?v=1.0.2-static4' index.html
          grep -q "diet-copilot-web-v1.0.2-static4" sw.js

      - name: Commit corrected web login runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thiepn'
          git config user.email 'junsosmart@gmail.com'
          git add src/auth/dashboard-auth-persist.js diet-app.js index.html sw.js tests/release.mjs .github/workflows/ci.yml .github/workflows/a7-operations.yml
          git commit -m 'Fix Diet web PKCE redirect allowlist regression'
          git push origin HEAD:main
