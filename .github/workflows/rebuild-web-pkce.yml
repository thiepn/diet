name: Rebuild Diet web PKCE runtime

on:
  push:
    paths:
      - '.github/workflows/rebuild-web-pkce.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build corrected web auth runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-v68.mjs --write
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','sw.js']:
              p=Path(name)
              s=p.read_text().replace('1.0.2-static2','1.0.2-static3')
              if name=='sw.js':
                  s=s.replace('diet-copilot-web-v1.0.2-static2','diet-copilot-web-v1.0.2-static3')
              p.write_text(s)
          PY
          node --check diet-app.js
          grep -q 'appendPkceFlowIdToRedirects: true' diet-app.js
          grep -q 'diet-app.js?v=1.0.2-static3' index.html
          grep -q 'diet.css?v=1.0.2-static3' index.html
          ! grep -q 'exchangeCodeForSession' web-auth-callback.html
          grep -q "new URL('/diet/'" web-auth-callback.html
      - name: Commit generated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thiepn'
          git config user.email 'junsosmart@gmail.com'
          git add diet-app.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild Diet web PKCE runtime and rotate assets'
          git push origin HEAD:main
