name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do node --check "$file"; done

      - name: Diet product and backend contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const backend=JSON.parse(fs.readFileSync('supabase/backend.json','utf8'));
          const bridge=fs.readFileSync('supabase/chatgpt-bridge.md','utf8');
          const finalPolicy=fs.readFileSync('dashboard-04.js','utf8');
          const v612=fs.readFileSync('dashboard-v6-1-2.js','utf8');
          const v62=fs.readFileSync('dashboard-v6-2.js','utf8');
          const v63=fs.readFileSync('dashboard-v6-3.js','utf8');
          const v64=fs.readFileSync('dashboard-v6-4.js','utf8');
          const v65=fs.readFileSync('dashboard-v6-5.js','utf8');
          const v66=fs.readFileSync('dashboard-v6-6.js','utf8');
          const d62=fs.readFileSync('supabase/decision-engine-v6.2.md','utf8');
          const d64=fs.readFileSync('supabase/reliability-v6.4.md','utf8');
          const d65=fs.readFileSync('supabase/weekly-intelligence-v6.5.md','utf8');
          const d66=fs.readFileSync('supabase/product-consolidation-v6.6.md','utf8');
          const shared='hycegznamzjhwinegaai',legacy='mrrqsqawwxwebsdmrnre';

          if(backend.canonical_project_ref!==shared)throw new Error('Wrong canonical backend.');
          if(!backend.legacy_project_refs?.includes(legacy)||!String(backend.legacy_policy).includes('retired'))throw new Error('Legacy backend is not retired.');
          if(backend.write_protocol?.require_request_id!==true||backend.write_protocol?.retry_same_request_id!==true||backend.write_protocol?.verify_after_write!==true||backend.write_protocol?.dual_write!==false)throw new Error('Reliable write protocol regressed.');
          if(backend.metrics_policy?.nutrition_days!=='all_days_with_logged_intake'||backend.metrics_policy?.weight!=='all_available_weigh_ins'||backend.metrics_policy?.day_status!=='coverage_metadata_only')throw new Error('All-logged-data metrics contract regressed.');
          if(backend.product_boundary?.logging_entrypoint!=='direct_chatgpt_conversation'||backend.product_boundary?.dashboard_manual_logging!==false||backend.product_boundary?.dashboard_quick_capture!==false)throw new Error('Dashboard product boundary regressed.');

          for(const capability of ['daily_decision_engine','food_memory_intelligence','post_write_verification','integrity_report','weekly_intelligence','week_over_week_comparison','trend_confidence','adaptive_coaching_v2','goal_forecast','maintenance_transition_guidance','descriptive_association_analysis','consolidated_insights','metric_provenance','standardized_confidence','history_quality_filters','single_pass_dashboard_refresh','unified_realtime_channel','today_core_only']){
            if(backend.capabilities?.[capability]!==true)throw new Error(`Missing capability: ${capability}`);
          }

          if(!v612.includes('v612NoTodayQuickCapture'))throw new Error('Quick Capture removal guard missing.');
          if(!v62.includes("Today's guidance")||!v62.includes('uncertaintyMaterial'))throw new Error('V6.2 guidance regressed.');
          if(!v63.includes('v63UsualPortion'))throw new Error('V6.3 portion intelligence missing.');
          if(!v64.includes('v64RefreshCanonical'))throw new Error('V6.4 canonical refresh missing.');
          if(!v65.includes('Weekly Intelligence & Adaptive Coaching 2.0')||!v65.includes('v65Trend')||!v65.includes('v65GoalForecast'))throw new Error('V6.5 weekly intelligence missing.');
          if(!v66.includes('Product Consolidation & Intelligent UX'))throw new Error('V6.6 consolidation layer missing.');
          for(const symbol of ['renderInsightsV66','refreshDataV66','subscribeRealtimeV66','v66Provenance','v66ConfidenceForRange'])if(!v66.includes(symbol))throw new Error(`V6.6 symbol missing: ${symbol}`);
          if(!v66.includes(".v6-capture-card')?.remove")||!v66.includes(".v6-activity')?.remove"))throw new Error('V6.6 Today must remain core-only.');
          if(v63.includes('refreshDataV63')||v65.includes('refreshDataV65'))throw new Error('Legacy refresh wrappers must be retired by V6.6.');

          if(!d62.includes('private.get_daily_guidance')||!d62.includes('private.compare_food_options'))throw new Error('V6.2 backend helpers undocumented.');
          for(const helper of ['private.get_action_status','private.preflight_meal_write','private.verify_ai_action','private.get_integrity_report','private.reconcile_integrity'])if(!d64.includes(helper))throw new Error(`V6.4 helper undocumented: ${helper}`);
          for(const helper of ['private.get_trend_confidence','private.get_adaptive_plan_decision','private.get_weekly_intelligence','private.generate_weekly_review'])if(!d65.includes(helper))throw new Error(`V6.5 helper undocumented: ${helper}`);
          for(const phrase of ['One coherent Insights page','Metric provenance','Standardized confidence','Single-pass refresh','Unified Realtime','Today remains core-only'])if(!d66.includes(phrase))throw new Error(`V6.6 contract missing: ${phrase}`);

          if(!bridge.includes(`Canonical project ref: \`${shared}\``)||!bridge.includes(legacy))throw new Error('ChatGPT bridge backend contract missing.');
          if(!finalPolicy.includes('Logged nutrition always counts')||!finalPolicy.includes('Day status is coverage metadata only'))throw new Error('All-logged-data final policy missing.');

          const auth=fs.readFileSync('dashboard-auth.js','utf8');
          const persist=fs.readFileSync('dashboard-auth-persist.js','utf8');
          if(!auth.includes('Continue with Google')||!auth.includes('signInWithPassword')||!auth.includes("auth.signOut({ scope: 'local' })"))throw new Error('THIEPN Account auth contract regressed.');
          if(persist.includes('setSession('))throw new Error('Legacy app-specific auth restoration returned.');
          console.log('Diet V6.6 product/backend contract passed.');
          NODE

      - name: PWA cache contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8'),sw=fs.readFileSync('sw.js','utf8');
          const assets=[...html.matchAll(/(?:src|href)="((?:dashboard-[^"]+|manifest\.webmanifest|icon\.(?:svg)|icon-(?:192|512)\.png))"/g)].map(m=>m[1]);
          const missing=assets.filter(a=>!sw.includes(`'./${a}'`));
          if(missing.length)throw new Error(`Service-worker CORE missing: ${missing.join(', ')}`);
          for(const required of ['dashboard-auth-final.js','dashboard-v6-4.js?v=6.4','dashboard-v6-5.js?v=6.5','dashboard-v6-5.css?v=6.5','dashboard-v6-6.js?v=6.6','dashboard-v6-6.css?v=6.6','dashboard-ops.js?v=7.1'])if(!sw.includes(required))throw new Error(`PWA missing ${required}`);
          if(!sw.includes("u.pathname.includes('/dashboard-')"))throw new Error('Dashboard assets must be network-first.');
          console.log(`PWA cache contract passed for ${assets.length} assets.`);
          NODE
