name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: P21 syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          node --check legacy-v1-app.js
          while IFS= read -r -d '' file; do
            tmp="$(mktemp --suffix=.mjs)"
            cp "$file" "$tmp"
            node --check "$tmp"
            rm -f "$tmp"
          done < <(find v2 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          for f in tests/p13-telemetry.mjs tests/p14-security-contract.mjs tests/p15-resilience-contract.mjs tests/p16-performance-contract.mjs tests/p17-privacy-lifecycle-contract.mjs tests/p18-integrity-contract.mjs tests/p19-concurrency-contract.mjs tests/p20-governance-contract.mjs tests/p21-incident-contract.mjs; do node --check "$f"; done
          python -m py_compile tests/p13-synthetic-monitor.py tests/p14-public-security-probe.py tests/p16-public-read-probe.py tests/p17-public-export-probe.py tests/p18-public-integrity-probe.py tests/p19-public-concurrency-probe.py tests/p20-public-release-status-probe.py tests/p21-public-failure-matrix.py tests/p21-live-failure.py scripts/p15-verify-offsite.py

      - name: P13 telemetry privacy regression
        run: node tests/p13-telemetry.mjs
      - name: P14 security regression
        run: node tests/p14-security-contract.mjs
      - name: P15 resilience regression
        run: node tests/p15-resilience-contract.mjs
      - name: P16 performance regression
        run: node tests/p16-performance-contract.mjs
      - name: P17 privacy and lifecycle regression
        run: node tests/p17-privacy-lifecycle-contract.mjs
      - name: P18 data integrity regression
        run: node tests/p18-integrity-contract.mjs
      - name: P19 concurrency regression
        run: node tests/p19-concurrency-contract.mjs
      - name: P20 change-governance regression
        run: node tests/p20-governance-contract.mjs
      - name: P21 failure, incident and recovery contract
        run: node tests/p21-incident-contract.mjs

      - name: P21 release contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const backend=JSON.parse(fs.readFileSync('supabase/backend.json','utf8'));
          const app=JSON.parse(fs.readFileSync('.well-known/thiepn-app.json','utf8'));
          const release=JSON.parse(fs.readFileSync('.well-known/thiepn-account-release.json','utf8'));
          for(const [k,v] of Object.entries({
            security_policy:'P14',
            resilience_policy:'P15',
            performance_policy:'P16',
            privacy_policy:'P17',
            integrity_policy:'P18',
            concurrency_policy:'P19',
            change_governance_policy:'P20',
            incident_response_policy:'P21'
          })) if(backend[k]?.release!==v) throw new Error('Release stack regressed: '+k);
          if(app.webRelease!=='2.0.3'||app.release!=='2.0.3'||app.operationsVersion!=='P21.0'||app.incidentCertificationRelease!=='P21')throw new Error('P21 release metadata invalid.');
          if(backend.incident_response_policy?.failure_certification?.status!=='pass'||backend.incident_response_policy?.failure_certification?.passed_count!==15)throw new Error('P21 certification is not fully green.');
          if(backend.incident_response_policy?.emergency_write_freeze?.current_writes_paused!==false)throw new Error('Diet writes unexpectedly paused.');
          if(backend.change_governance_policy?.checkpoint?.release!=='P21'||backend.change_governance_policy?.checkpoint?.status!=='clean')throw new Error('P21 schema checkpoint is not clean.');
          if(release.consumerRelease!==app.webRelease)throw new Error('Account consumer release mismatch.');
          console.log('Diet Copilot Web 2.0.3 / P21 operations contract passed.');
          NODE

      - name: Build actual GitHub Pages artifact
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html manifest.webmanifest sw.js legacy-v1.html legacy-v1-app.js v2/index.html v2/data.js v2/auth-storage.mjs v2/write-api.mjs v2/telemetry.mjs v2/settings.js v2/shell.css vendor/supabase-2.116.0.js .well-known/thiepn-app.json; do
            test -f "_site/$f"
          done
          grep -q 'dc-version-badge">2.0<' _site/index.html
          ! grep -q '2.0 RC' _site/index.html
          grep -q 'diet-copilot-prod-v2-p17-1' _site/sw.js
