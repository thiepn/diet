name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: P20 syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          node --check legacy-v1-app.js
          while IFS= read -r -d '' file; do
            tmp="$(mktemp --suffix=.mjs)"
            cp "$file" "$tmp"
            node --check "$tmp"
            rm -f "$tmp"
          done < <(find v2 -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          node --check tests/p13-telemetry.mjs
          node --check tests/p14-security-contract.mjs
          node --check tests/p15-resilience-contract.mjs
          node --check tests/p16-performance-contract.mjs
          node --check tests/p17-privacy-lifecycle-contract.mjs
          node --check tests/p18-integrity-contract.mjs
          node --check tests/p19-concurrency-contract.mjs
          node --check tests/p20-governance-contract.mjs
          python -m py_compile tests/p13-synthetic-monitor.py tests/p14-public-security-probe.py tests/p16-public-read-probe.py tests/p17-public-export-probe.py tests/p18-public-integrity-probe.py tests/p19-public-concurrency-probe.py tests/p20-public-release-status-probe.py scripts/p15-verify-offsite.py

      - name: P13 telemetry privacy regression
        run: node tests/p13-telemetry.mjs
      - name: P14 security regression
        run: node tests/p14-security-contract.mjs
      - name: P15 resilience regression
        run: node tests/p15-resilience-contract.mjs
      - name: P16 performance regression
        run: node tests/p16-performance-contract.mjs
      - name: P17 privacy and lifecycle regression
        run: node tests/p17-privacy-lifecycle-contract.mjs
      - name: P18 data integrity regression
        run: node tests/p18-integrity-contract.mjs
      - name: P19 concurrency regression
        run: node tests/p19-concurrency-contract.mjs
      - name: P20 schema governance contract
        run: node tests/p20-governance-contract.mjs

      - name: P20 release contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const backend=JSON.parse(fs.readFileSync('supabase/backend.json','utf8'));
          const app=JSON.parse(fs.readFileSync('.well-known/thiepn-app.json','utf8'));
          const release=JSON.parse(fs.readFileSync('.well-known/thiepn-account-release.json','utf8'));
          if(backend.canonical_project_ref!=='hycegznamzjhwinegaai')throw new Error('Wrong canonical backend.');
          if(backend.security_policy?.release!=='P14')throw new Error('P14 security regressed.');
          if(backend.resilience_policy?.release!=='P15')throw new Error('P15 resilience regressed.');
          if(backend.performance_policy?.release!=='P16')throw new Error('P16 performance regressed.');
          if(backend.privacy_policy?.release!=='P17')throw new Error('P17 privacy regressed.');
          if(backend.integrity_policy?.release!=='P18')throw new Error('P18 integrity regressed.');
          if(backend.concurrency_policy?.release!=='P19')throw new Error('P19 concurrency regressed.');
          if(backend.change_governance_policy?.release!=='P20')throw new Error('P20 governance policy invalid.');
          if(backend.change_governance_policy?.checkpoint?.status!=='clean')throw new Error('P20 checkpoint not clean.');
          if(!/^[0-9a-f]{64}$/.test(backend.change_governance_policy?.certified_schema_sha256||''))throw new Error('P20 schema fingerprint invalid.');
          if(app.webRelease!=='2.0.3'||app.operationsVersion!=='P20.0'||app.changeGovernanceRelease!=='P20')throw new Error('P20 release metadata invalid.');
          if(release.consumerRelease!==app.webRelease)throw new Error('Account consumer release mismatch.');
          console.log('Diet Copilot Web 2.0.3 / P20 operations contract passed.');
          NODE

      - name: Build actual GitHub Pages artifact
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html manifest.webmanifest sw.js legacy-v1.html legacy-v1-app.js v2/index.html v2/data.js v2/auth-storage.mjs v2/write-api.mjs v2/telemetry.mjs v2/settings.js v2/shell.css vendor/supabase-2.116.0.js .well-known/thiepn-app.json; do
            test -f "_site/$f"
          done
          grep -q 'dc-version-badge">2.0<' _site/index.html
          ! grep -q '2.0 RC' _site/index.html
          grep -q 'diet-copilot-prod-v2-p17-1' _site/sw.js
