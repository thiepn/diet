name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done

      - name: THIEPN Account and Diet backend contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const runtimeFiles = ['dashboard-01.js', 'dashboard-config.js', 'dashboard-auth-persist.js', 'dashboard-auth.js'];
          const text = Object.fromEntries(runtimeFiles.map((file) => [file, fs.readFileSync(file, 'utf8')]));
          const bridge = fs.readFileSync('supabase/chatgpt-bridge.md', 'utf8');
          const backend = JSON.parse(fs.readFileSync('supabase/backend.json', 'utf8'));
          const sharedProject = 'hycegznamzjhwinegaai';
          const oldProject = 'mrrqsqawwxwebsdmrnre';
          const sharedStorage = `sb-${sharedProject}-auth-token`;
          const legacyBackup = 'diet-copilot-thiepn-auth-token-backup-v2';
          const legacyVault = 'diet-copilot-auth-vault';

          if (backend.canonical_project_ref !== sharedProject) throw new Error('Backend manifest points at the wrong canonical project.');
          if (!backend.legacy_project_refs?.includes(oldProject)) throw new Error('Backend manifest does not mark the legacy project.');
          if (backend.write_protocol?.dual_write !== false) throw new Error('Backend manifest must prohibit dual writes.');
          if (backend.write_protocol?.require_request_id !== true) throw new Error('Backend manifest must require request IDs.');

          if (!text['dashboard-01.js'].includes(sharedProject)) throw new Error('Dashboard runtime is not on the canonical THIEPN Account backend.');
          if (!text['dashboard-config.js'].includes(sharedProject)) throw new Error('Dashboard config is not on the canonical THIEPN Account backend.');
          if (!text['dashboard-auth-persist.js'].includes(sharedStorage)) throw new Error('Diet auth does not use the shared THIEPN Account storage key.');

          for (const file of runtimeFiles) {
            if (text[file].includes(oldProject)) throw new Error(`${file} still references the retired Diet backend.`);
          }

          if (!bridge.includes(`Canonical project ref: \`${sharedProject}\``)) throw new Error('ChatGPT bridge does not declare the canonical backend ref.');
          if (!bridge.includes(oldProject) || !bridge.toLowerCase().includes('retired')) throw new Error('ChatGPT bridge does not explicitly retire the legacy backend.');
          if (!bridge.includes('stable, unique `p_request_id`')) throw new Error('ChatGPT bridge is missing the idempotent-write rule.');

          if (!text['dashboard-auth.js'].includes('Continue with Google')) throw new Error('Google THIEPN Account entry point is missing.');
          if (!text['dashboard-auth.js'].includes('signInWithPassword')) throw new Error('Email/password THIEPN Account entry point is missing.');
          if (!text['dashboard-auth.js'].includes("auth.signOut({ scope: 'local' })")) {
            throw new Error('Diet browser sign-out must use explicit local Supabase scope.');
          }
          if (/auth\.signOut\(\s*\)/.test(text['dashboard-auth.js'])) {
            throw new Error('Diet must not use Supabase JavaScript global sign-out by default.');
          }

          const bootstrap = text['dashboard-auth-persist.js'];
          if (bootstrap.includes('setSession(')) throw new Error('Diet must not restore auth from an app-specific token copy.');
          if (bootstrap.includes('access_token: recovery') || bootstrap.includes('refresh_token: recovery')) {
            throw new Error('Diet contains legacy token-recovery logic.');
          }
          const cleanupOnly = bootstrap
            .replaceAll(`localStorage.removeItem(LEGACY_DIET_AUTH_BACKUP_KEY)`, '')
            .replaceAll(`indexedDB.deleteDatabase(LEGACY_DIET_AUTH_DB)`, '');
          if (cleanupOnly.includes(`localStorage.setItem(LEGACY_DIET_AUTH_BACKUP_KEY`)) {
            throw new Error('Diet must not persist a duplicate auth-token backup.');
          }
          if (!bootstrap.includes(legacyBackup) || !bootstrap.includes(legacyVault)) {
            throw new Error('A6 targeted legacy auth cleanup is missing.');
          }
          if (text['dashboard-auth.js'].includes('clearDietAuthRecovery')) {
            throw new Error('Legacy auth-recovery hooks remain in the UI layer.');
          }

          console.log('Diet A6 backend + THIEPN Account contract passed.');
          NODE

      - name: PWA cache contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const html = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const assets = [...html.matchAll(/(?:src|href)="((?:dashboard-[^"]+|manifest\.webmanifest|icon\.(?:svg)|icon-(?:192|512)\.png))"/g)].map(m => m[1]);
          const missing = assets.filter(asset => !sw.includes(`'./${asset}'`));
          if (missing.length) throw new Error(`Service-worker CORE is missing index assets: ${missing.join(', ')}`);
          if (!sw.includes('dashboard-auth-final.js')) throw new Error('Final auth compatibility layer is not precached.');
          console.log(`PWA cache contract passed for ${assets.length} assets.`);
          NODE
