name: P34 Continuous Assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform-p3*.json'
      - 'platform-p33-audit-ledger.jsonl'
      - 'scripts/p3*.py'
      - 'contracts/p3*.json'
      - 'docs/P3*.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p34-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify P34 structural contract
        run: node tests/p34-assurance-contract.mjs

      - name: Verify P34 assurance negative paths
        run: python tests/p34-assurance-contract.py

      - name: Produce assurance result
        run: python scripts/p34-assess-controls.py --out p34-assurance-result.json

      - name: Build internal audit-readiness package
        shell: bash
        run: |
          cat > p34-package-manifest.json <<'JSON'
          {
            "scope":"THIEPN shared platform internal security-control readiness",
            "periodStart":"2026-10-03T21:52:18Z",
            "periodEnd":"2026-10-03T22:06:34Z",
            "readinessStatement":"Internal readiness package with point-in-time evidence and open deficiencies; no external attestation is claimed.",
            "readinessLevel":2,
            "externalAttestation":false,
            "frameworkMappings":[
              "NIST CSF 2.0 function-level internal crosswalk",
              "AICPA Trust Services Criteria high-level domain crosswalk"
            ],
            "openDeficiencyIds":[
              "P34-D001","P34-D002","P34-D003","P34-D004",
              "P34-D005","P34-D006","P34-D007","P34-D008"
            ],
            "assessmentResultPath":"p34-assurance-result.json",
            "deficiencyRegisterPath":"platform-p34-deficiency-register.json",
            "p33LedgerPath":"platform-p33-audit-ledger.jsonl",
            "p33AnchorPath":"platform-p33-ledger-anchor.json",
            "requiredArtifacts":[
              {"name":"control-catalog","path":"platform-p34-control-catalog.json","kind":"control-catalog"},
              {"name":"assurance-snapshot","path":"platform-p34-assurance-snapshot.json","kind":"assurance-snapshot"},
              {"name":"deficiency-register","path":"platform-p34-deficiency-register.json","kind":"deficiency-register"},
              {"name":"audit-readiness-plan","path":"platform-p34-audit-readiness-plan.json","kind":"readiness-plan"},
              {"name":"p33-evidence-policy","path":"platform-p33-evidence-policy.json","kind":"provenance-policy"},
              {"name":"p33-ledger-anchor","path":"platform-p33-ledger-anchor.json","kind":"ledger-anchor"}
            ]
          }
          JSON
          python scripts/p34-build-audit-package.py p34-package-manifest.json --out p34-audit-readiness-package.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p34-assurance-${{ github.run_id }}
          path: |
            p34-assurance-result.json
            p34-audit-readiness-package.json
          if-no-files-found: error
          retention-days: 90
