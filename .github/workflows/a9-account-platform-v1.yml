name: A9 Account Platform v1
on:
  pull_request:
    branches: [main]
    paths:
      - '.well-known/thiepn-account-release.json'
      - '.well-known/thiepn-app.json'
      - '.github/workflows/a9-account-platform-v1.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify Diet P36 on Account Platform v1
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app=JSON.parse(fs.readFileSync('.well-known/thiepn-app.json','utf8'));
          const release=JSON.parse(fs.readFileSync('.well-known/thiepn-account-release.json','utf8'));
          if(release.platformRelease!=='1.0.0')throw new Error('Unexpected platform release.');
          if(release.platformCommit!=='169e083f268e895cd44d8a5fe706ba5d4532bfa2')throw new Error('Unexpected platform release commit.');
          for(const key of ['accountContract','sdkContract','integrationMode'])if(release[key]!==app[key])throw new Error('Release contract mismatch: '+key);
          if(release.consumerRelease!=='2.0.3'||release.consumerRelease!==app.webRelease)throw new Error('Diet Web 2.0.3 consumer release mismatch.');
          if(release.consumerIntegrationPhase!=='P36'||release.accountUiPattern!=='A8'||app.accountConsumerUiPhase!=='P36')throw new Error('Diet P36 Account consumer integration mismatch.');
          console.log('Diet Platform v1 / Diet P36 metadata passed.');
          NODE
