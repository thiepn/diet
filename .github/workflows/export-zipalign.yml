name: Export Android zipalign

on:
  push:
    paths:
      - '.github/workflows/export-zipalign.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android SDK zipalign
        shell: bash
        run: |
          set -euo pipefail
          tool="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -print | sort -V | tail -1)"
          test -n "$tool"
          mkdir -p /tmp/zipalign-tool
          cp "$tool" /tmp/zipalign-tool/zipalign
          chmod +x /tmp/zipalign-tool/zipalign
          "$tool" -h >/dev/null 2>&1 || true

      - name: Upload zipalign
        uses: actions/upload-artifact@v4
        with:
          name: android-zipalign
          path: /tmp/zipalign-tool
          if-no-files-found: error
          retention-days: 1
