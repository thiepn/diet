name: Rebuild Diet static7 auth storage

on:
  push:
    paths:
      - '.github/workflows/rebuild-static7-auth-storage.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build static7 web runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-v68.mjs --write
          python - <<'PY'
          from pathlib import Path

          for name in ['index.html', 'sw.js', 'tests/release.mjs']:
              p = Path(name)
              s = p.read_text().replace('static6', 'static7')
              p.write_text(s)

          p = Path('tests/release.mjs')
          s = p.read_text()
          old = "assert.ok(js.includes('dietBackupBrowserPkceVerifier')&&js.includes('dietRestoreBrowserPkceVerifier')&&js.includes('DIET_PKCE_BACKUP_KEY'),'Tab-scoped PKCE verifier recovery is missing');\n"
          new = "assert.ok(js.includes('dietAuthStorage')&&js.includes('dietMirrorPkceStorageEntry')&&js.includes('dietRestoreBrowserPkceVerifier')&&js.includes('DIET_PKCE_BACKUP_KEY'),'Controlled PKCE storage recovery is missing');\nassert.ok(js.includes('__dietAuthStorageV2')&&js.includes('dietTagBrowserPkceBackupFlow'),'Final auth client enforcement is missing');\n"
          if old not in s:
              raise SystemExit('static6 PKCE release assertion anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY

          node --check diet-app.js
          node scripts/build-v68.mjs
          node tests/release.mjs
          grep -q 'storage: dietAuthStorage' diet-app.js
          grep -q 'dietMirrorPkceStorageEntry' diet-app.js
          grep -q '__dietAuthStorageV2' diet-app.js
          grep -q 'diet-app.js?v=1.0.2-static7' index.html
          grep -q 'diet-copilot-web-v1.0.2-static7' sw.js
          ! grep -q 'Supabase did not persist the PKCE verifier before redirect' diet-app.js

      - name: Commit static7 web release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thiepn'
          git config user.email 'junsosmart@gmail.com'
          git add diet-app.js index.html sw.js tests/release.mjs
          git commit -m 'Ship controlled PKCE storage in static7'
          git push origin HEAD:main
