name: P38 Product Release Candidate
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'v2/**'
      - 'vendor/**'
      - '.well-known/**'
      - 'legacy-v1.html'
      - 'legacy-v1-app.js'
      - 'diet-app.js'
      - 'diet.css'
      - 'icon.svg'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'tests/p38-*'
      - '.github/workflows/p38-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p38-release-candidate
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: P38 candidate contract
        run: node tests/p38-product-release-candidate-contract.mjs

  deployed-assets:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Wait for exact public deployment
        run: python tests/p38-deployed-production.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p38-deployed-production
          path: p38-deployed-production.json
          retention-days: 30

  browser:
    needs: deployed-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned browser tooling
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Certify public production
        run: python tests/p38-live-candidate.py --browser ${{ matrix.browser }} --out p38-live-${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p38-live-${{ matrix.browser }}
          path: p38-live-${{ matrix.browser }}/
          retention-days: 30
