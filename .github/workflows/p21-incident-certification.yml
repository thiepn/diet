name: P21 Full Failure & Recovery Certification
on:
  push:
    branches: [main]
    paths:
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - '.well-known/thiepn-app.json'
      - 'tests/p21-*'
      - 'tests/p13-synthetic-monitor.py'
      - 'docs/P21-*'
      - '.github/workflows/p21-incident-certification.yml'
      - '.github/workflows/p13-production-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p21-full-failure-certification
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: P21 static contract
        run: |
          node tests/p21-incident-contract.mjs
          python -m py_compile tests/p21-public-failure-matrix.py tests/p21-live-failure.py tests/p13-synthetic-monitor.py

  public-matrix:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Public incident and authorization matrix
        run: python tests/p21-public-failure-matrix.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p21-public-failure-matrix
          path: p21-public-failure-matrix.json
          retention-days: 14

  browser:
    needs: public-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Live browser failure and reconnect certification
        run: python tests/p21-live-failure.py --browser ${{ matrix.browser }} --out p21-live-${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p21-live-${{ matrix.browser }}
          path: p21-live-${{ matrix.browser }}/
          retention-days: 14
