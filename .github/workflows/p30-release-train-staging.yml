name: P30 Release Train Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p30-release-train-certification
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify P30 release train contract
        run: node tests/p30-release-train-contract.mjs
      - name: Verify P30 candidate, promotion and rollout contracts
        run: python tests/p30-promotion-contract.py
      - name: Build immutable example app-fast candidate
        shell: bash
        run: |
          cat > p30-example-manifest.json <<'JSON'
          {
            "trainId":"p30-example-app-fast",
            "trainType":"app_fast",
            "gitSha":"${{ github.sha }}",
            "dependencyGraphVersion":"2026-10-03.1",
            "dependencyGraphSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "p29CertificateId":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
            "changeManifestSha256":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc",
            "impactAnalysisSha256":"dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd",
            "semanticSchemaSha256":"5b7b1caddef09b97f59c85d79d04eabfbe55120fe1754340a7367c1b14d39375",
            "migrationHead":"20261003105645",
            "edgeInventorySha256":"8400fe3f4f203d37e8208a8541c2e6ffc7d49ace98871ecdb80fef1026842da8",
            "cronInventorySha256":"9d229da38afa923fb839eaf59e5c3d19dbec96edd47abe008b7c7e00969f2396",
            "environmentTopologyVersion":"2026-10-03.2"
          }
          JSON
          python scripts/p30-build-candidate.py p30-example-manifest.json --out p30-example-candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p30-release-train-${{ github.run_id }}
          path: p30-example-candidate.json
          if-no-files-found: error
          retention-days: 30
