name: P31 Fleet Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p31-fleet-control-plane
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify P31 structural contract
        run: node tests/p31-control-plane-contract.mjs
      - name: Verify P31 release decisions
        run: python tests/p31-control-plane-contract.py
      - name: Validate registries
        run: python scripts/p31-control-plane.py validate --out p31-registry-validation.json
      - name: Produce fleet status
        run: python scripts/p31-control-plane.py status --out p31-fleet-status.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p31-control-plane-${{ github.run_id }}
          path: |
            p31-registry-validation.json
            p31-fleet-status.json
          if-no-files-found: error
          retention-days: 30
