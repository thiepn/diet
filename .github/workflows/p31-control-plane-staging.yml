name: P31 Control Plane Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p31-control-plane-staging
  cancel-in-progress: true

jobs:
  staged:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify P31 registry contract
        run: node tests/p31-control-plane-contract.mjs
      - name: Verify P31 control-plane decisions
        run: python tests/p31-control-plane-contract.py
      - name: Produce current staged fleet status
        run: python scripts/p31-control-plane.py status --out p31-fleet-status.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p31-control-plane-${{ github.run_id }}
          path: p31-fleet-status.json
          if-no-files-found: error
          retention-days: 30
