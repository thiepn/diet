name: P24 Controlled Upgrade Preflight
on:
  push:
    branches: [main]
    paths:
      - 'platform-p23-inventory.json'
      - 'platform-p24-pre-upgrade.json'
      - '.well-known/thiepn-app.json'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - 'tests/p24-*'
      - 'docs/P24-*'
      - '.github/workflows/p24-upgrade-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p24-controlled-upgrade-preflight
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: P24 execution-boundary contract
        run: |
          node tests/p24-execution-contract.mjs
          python -m py_compile tests/p24-preupgrade-public.py

  public:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Shared platform public pre-upgrade health
        run: python tests/p24-preupgrade-public.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p24-preupgrade-public
          path: p24-preupgrade-public.json
          retention-days: 30
