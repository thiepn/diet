name: P29 Cross-App Release Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p29-release-certification
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate dependency graph
        run: node scripts/p29-validate-graph.mjs p29-graph-validation.json
      - name: Verify P29 release contract
        run: node tests/p29-release-orchestration-contract.mjs
      - name: Verify impact and certificate engines
        run: python tests/p29-orchestration-contract.py
      - name: Produce current Micro Arcade recovery impact example
        shell: bash
        run: |
          cat > p29-change.json <<'JSON'
          {
            "changeId":"micro-arcade-p31-backend-recovery",
            "graphVersion":"2026-10-03.1",
            "changes":[
              {
                "component":"micro_arcade",
                "class":"operational_job",
                "changesSharedSchema":true,
                "changesEdgeContract":true,
                "changesCronInventory":true
              }
            ]
          }
          JSON
          python scripts/p29-impact-analysis.py p29-change.json --out p29-impact-analysis.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p29-release-${{ github.run_id }}
          path: |
            p29-graph-validation.json
            p29-impact-analysis.json
          if-no-files-found: error
          retention-days: 30
