name: A8 Account Consumer Contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.well-known/thiepn-app.json'
      - '.well-known/thiepn-account-release.json'
      - 'v2/**'
      - '.github/workflows/a8-account-contract.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate Diet 2.0.3 / P19 account consumer contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app=JSON.parse(fs.readFileSync('.well-known/thiepn-app.json','utf8'));
          const data=fs.readFileSync('v2/data.js','utf8');
          const auth=fs.readFileSync('v2/auth-storage.mjs','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const all=fs.readdirSync('v2',{recursive:true}).filter(p=>/\.(?:js|mjs)$/.test(String(p))).map(p=>fs.readFileSync('v2/'+p,'utf8')).join('\n');
          const expected={schemaVersion:'1.0',app:'diet',displayName:'Diet Copilot',path:'/diet/',accountContract:'1.0',sdkContract:'1.x',integrationMode:'certified-legacy',operationsVersion:'P19.0',sessionAuthority:'thiepn-account'};
          for(const [key,value] of Object.entries(expected))if(app[key]!==value)throw new Error('Diet A8 manifest mismatch: '+key);
          if(app.webRelease!=='2.0.3'||app.sourceLayout!=='v2'||app.runtimeMode!=='adaptive-v2-production-monitored')throw new Error('Diet Web 2.0.3 runtime metadata invalid.');
          if(app.securityRelease!=='P14'||app.resilienceRelease!=='P15'||app.performanceRelease!=='P16'||app.privacyRelease!=='P17'||app.integrityRelease!=='P18'||app.concurrencyRelease!=='P19')throw new Error('Diet release stack invalid.');
          if(JSON.stringify(app.authEntryPoints)!==JSON.stringify(['google']))throw new Error('Diet must remain Google-only auth.');
          if(!html.includes('Continue with Google')||!data.includes("provider:'google'"))throw new Error('Google account entry point regressed.');
          if(!data.includes("flowType:'pkce'")||!data.includes('storage:dietV2AuthStorage'))throw new Error('Diet PKCE/session contract regressed.');
          if(!data.includes('hycegznamzjhwinegaai')||data.includes('mrrqsqawwxwebsdmrnre'))throw new Error('Canonical project contract regressed.');
          for(const banned of ['signInWithPassword','resetPasswordForEmail','loginPassword','passwordForm','email-password'])if(all.includes(banned))throw new Error('Legacy password auth returned: '+banned);
          if(!auth.includes("Path=/")||!auth.includes('SameSite=Lax'))throw new Error('Persistent auth storage contract regressed.');
          console.log('Diet A8 consumer contract passed for Web 2.0.3 / P19.');
          NODE
