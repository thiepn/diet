name: Finalize account browser fixtures
on:
  push:
    branches: [fix/account-release-final]
    paths: [.github/workflows/finalize-account-fixtures.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/account-release-final
      - name: Correct WebKit provider navigation fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/account-browser.py');s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='20f2e080df34bab7c6fed23e5b71a41a40aec42b1f2aa5130ade7491f868fc9d'
          s=s.replace("return await route.fulfill(status=302,headers={'location':ORIGIN+'/WORDSTRIKE/?code=fixture-code'})",'''return await route.fulfill(content_type='text/html',body='<script>location.replace('+json.dumps(ORIGIN+'/WORDSTRIKE/?code=fixture-code')+')</script>')''')
          s=s.replace('            finally:await context.close()', '''            finally:
                          (OUT/'results.json').write_text(json.dumps({'browser':args.browser,'tests':results},indent=2))
                          await context.close()'''.replace('                          ','                '))
          assert hashlib.sha256(s.encode()).hexdigest()=='a0491f1d6adb2a7c575f1c0c4a3f0910ce1865df9a5ac1c6dbd6b22a861fb594'
          p.write_text(s)
          PY
          python3 -m py_compile tests/account-browser.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/account-browser.py
          git commit -m 'Keep real provider navigation while supporting WebKit fixture interception'
          git push origin HEAD:fix/account-release-final
