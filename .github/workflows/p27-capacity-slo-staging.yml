name: P27 Capacity and SLO Monitoring

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p27-capacity-slo-monitoring
  cancel-in-progress: true

jobs:
  public-slo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify P27 contract
        run: node tests/p27-capacity-slo-contract.mjs
      - name: Capture public SLO sample
        run: python tests/p27-public-slo.py --out p27-public-slo.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p27-slo-${{ github.run_id }}
          path: p27-public-slo.json
          if-no-files-found: error
          retention-days: 30
