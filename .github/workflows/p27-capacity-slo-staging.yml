name: P27 Capacity and SLO Monitoring

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p27-capacity-slo-monitoring
  cancel-in-progress: true

jobs:
  public-slo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify P27 contract
        run: node tests/p27-capacity-slo-contract.mjs
      - name: Capture public SLO sample
        run: python tests/p27-public-slo.py --out p27-public-slo.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p27-slo-${{ github.run_id }}
          path: p27-public-slo.json
          if-no-files-found: error
          retention-days: 30
