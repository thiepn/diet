name: P16 Production Performance
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'sw.js'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - '.well-known/**'
      - 'tests/p16-*'
      - 'docs/P16-*'
      - '.github/workflows/p16-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p16-production-performance
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: P16 performance contract
        run: |
          node tests/p16-performance-contract.mjs
          python -m py_compile tests/p16-public-read-probe.py

  public-boundary:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify anonymous client cannot invoke P16 private read
        run: python tests/p16-public-read-probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p16-public-read
          path: p16-public-read.json
          retention-days: 14
