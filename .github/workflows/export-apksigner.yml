name: Export Android APK signer

on:
  push:
    paths:
      - '.github/workflows/export-apksigner.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android SDK signer
        shell: bash
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$signer"
          dir="$(dirname "$signer")"
          test -f "$dir/lib/apksigner.jar"
          mkdir -p /tmp/apksigner-tool/lib
          cp "$dir/apksigner" /tmp/apksigner-tool/apksigner
          cp "$dir/lib/apksigner.jar" /tmp/apksigner-tool/lib/apksigner.jar
          chmod +x /tmp/apksigner-tool/apksigner
          "$signer" version

      - name: Upload signer
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner
          path: /tmp/apksigner-tool
          if-no-files-found: error
          retention-days: 1
