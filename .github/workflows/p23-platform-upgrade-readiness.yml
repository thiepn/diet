name: P23 Shared Platform Upgrade Readiness
on:
  push:
    branches: [main]
    paths:
      - 'platform-p23-inventory.json'
      - '.well-known/thiepn-app.json'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - 'tests/p23-*'
      - 'docs/P23-*'
      - '.github/workflows/p23-platform-upgrade-readiness.yml'
  schedule:
    - cron: '43 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p23-shared-platform-upgrade-readiness
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: P23 shared-platform static contract
        run: |
          node tests/p23-platform-contract.mjs
          python -m py_compile tests/p23-shared-platform-public.py

  public:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Shared Auth, platform-health and public boundary
        run: python tests/p23-shared-platform-public.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p23-shared-platform-public
          path: p23-shared-platform-public.json
          retention-days: 30
