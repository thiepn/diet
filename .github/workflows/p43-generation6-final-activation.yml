name: P43 Generation-6 Final Revalidation and Activation

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform-p41-*.json'
      - 'platform-p42-*.json'
      - 'platform-p43-*.json'
      - 'scripts/p43-*.py'
      - 'tests/p43-*'
      - 'docs/P43-*.md'
      - '.github/workflows/p43-generation6-final-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p43-generation6-final-activation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify structural contract
        run: node tests/p43-generation6-activation-contract.mjs

      - name: Verify final gate and deterministic activation transform
        run: python tests/p43-generation6-activation-contract.py

      - name: Produce current fail-closed P43 receipt
        run: |
          python scripts/p43-final-revalidate.py \
            platform-p43-live-observation.json \
            platform-p43-backup-evidence.json \
            --out p43-current-final-decision.json
          python scripts/p43-activate-generation6.py \
            p43-current-final-decision.json \
            --out-dir p43-current-activation-preview
          python - <<'PY'
          import json
          d=json.load(open('p43-current-final-decision.json'))
          a=json.load(open('p43-current-activation-preview/p43-generation6-activation-receipt.json'))
          assert d['decision']=='blocked'
          assert d['backupFresh'] is True
          assert d['candidateEpochStable'] is True
          assert a['decision']=='blocked'
          assert a['activationReceiptId'] is None
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p43-generation6-final-gate-${{ github.run_id }}
          path: |
            p43-current-final-decision.json
            p43-current-activation-preview/p43-generation6-activation-receipt.json
          if-no-files-found: error
          retention-days: 90
