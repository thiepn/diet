name: P42 Generation-6 Refreeze and Activation Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform-p41-*.json'
      - 'platform-p42-*.json'
      - 'scripts/p42-*.py'
      - 'tests/p42-*'
      - 'docs/P42-*.md'
      - '.github/workflows/p15-offsite-backup.yml'
      - '.github/workflows/p42-generation6-refreeze.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p42-generation6-refreeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify P42 structural contract
        run: node tests/p42-generation6-readiness-contract.mjs

      - name: Verify P42 readiness and fail-closed negative paths
        run: python tests/p42-generation6-readiness-contract.py

      - name: Produce current blocked readiness receipt
        run: |
          python scripts/p42-evaluate-generation6-readiness.py \
            platform-p42-live-candidate-observation.json \
            platform-p42-latest-backup-evidence.json \
            --out p42-current-readiness.json
          python - <<'PY'
          import json
          r=json.load(open('p42-current-readiness.json'))
          assert r['decision']=='blocked'
          assert r['eligibleToActivate'] is False
          assert r['generation6Activated'] is False
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p42-generation6-refreeze-${{ github.run_id }}
          path: p42-current-readiness.json
          if-no-files-found: error
          retention-days: 90
