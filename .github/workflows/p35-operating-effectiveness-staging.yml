name: P35 Remediation and Operating Effectiveness

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform-p3*.json'
      - 'platform-p33-audit-ledger.jsonl'
      - 'scripts/p3*.py'
      - 'contracts/p3*.json'
      - 'docs/P3*.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p35-operating-effectiveness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify P35 structural contract
        run: node tests/p35-control-remediation-contract.mjs

      - name: Verify P35 remediation and OE negative paths
        run: python tests/p35-control-remediation-contract.py

      - name: Produce remediation assessment
        run: python scripts/p35-assess-remediation.py --out p35-remediation-assessment.json

      - name: Verify operating-effectiveness evaluator CLI
        run: python scripts/p35-evaluate-operating-effectiveness.py --help > /dev/null

      - name: Verify audit dry-run CLI
        run: python scripts/p35-audit-dry-run.py --help > /dev/null

      - name: Build current start-gate evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          anchor=json.loads(Path("platform-p33-ledger-anchor.json").read_text())
          gate={
            "periodId":"p35-current-operating-period",
            "mode":"operating",
            "observedAt":"2026-10-03T22:55:16.598746Z",
            "scopedEpochStableMinutes":0,
            "criticalOpen":0,
            "highDeficiencyStates":{
              "P34-D001":"decision_required",
              "P34-D002":"authorization_review_ready",
              "P34-D005":"governance_onboarding_required"
            },
            "p32Mode":"warn",
            "p33LedgerVerified":True,
            "controlCatalogFrozen":True,
            "evidenceCollectorContractPass":True,
            "explicitAuthorization":False,
            "p34CatalogVersion":"2026-10-03.1",
            "p34SnapshotVersion":"2026-10-03.1",
            "p33HeadHash":anchor["headHash"],
            "p33AnchorSha256":sha("platform-p33-ledger-anchor.json"),
            "controlCatalogSha256":sha("platform-p34-control-catalog.json"),
            "p34SnapshotSha256":sha("platform-p34-assurance-snapshot.json"),
            "requestedBy":"platform",
            "authorizedBy":"independent-reviewer"
          }
          Path("current-start-gate.json").write_text(json.dumps(gate,indent=2)+"\n")
          PY
          python scripts/p35-authorize-period.py current-start-gate.json --out p35-period-start-decision.json
          python - <<'PY'
          import json
          d=json.load(open("p35-period-start-decision.json"))
          assert d["decision"]=="block"
          assert d["canStart"] is False
          assert d["periodClockStarted"] is False
          print("Current real P35 period correctly remains blocked:", ",".join(d["blockers"]))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p35-assurance-${{ github.run_id }}
          path: |
            p35-remediation-assessment.json
            p35-period-start-decision.json
            current-start-gate.json
          if-no-files-found: error
          retention-days: 90
