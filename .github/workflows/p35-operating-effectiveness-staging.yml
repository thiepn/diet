name: P35 Remediation and OE Staging

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform-p3*.json'
      - 'scripts/p3*.py'
      - 'contracts/p3*.json'
      - 'docs/P3*.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p35-oe-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify P35 static contract
        run: node tests/p35-control-remediation-contract.mjs
      - name: Verify P35 remediation/OE/dry-run negative paths
        run: python tests/p35-control-remediation-contract.py
      - name: Verify evidence-period CLI
        run: python scripts/p35-evaluate-operating-effectiveness.py --help > /dev/null
      - name: Verify audit dry-run CLI
        run: python scripts/p35-audit-dry-run.py --help > /dev/null
      - name: Produce remediation assessment
        run: python scripts/p35-assess-remediation.py --out p35-remediation-assessment.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p35-remediation-${{ github.run_id }}
          path: p35-remediation-assessment.json
          if-no-files-found: error
          retention-days: 90
