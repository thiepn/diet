name: P21 Hourly Production Readiness
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p21-hourly-monitor
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Probe current production release
        run: python tests/p13-synthetic-monitor.py
      - name: Probe public failure boundaries
        run: python tests/p21-public-failure-matrix.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: p21-hourly-production-readiness
          path: |
            p21-hourly-monitor.json
            p21-public-failure-matrix.json
          retention-days: 14
