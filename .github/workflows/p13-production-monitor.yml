name: P21 Hourly Production Readiness
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p21-hourly-monitor
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe current production release
        run: python tests/p13-synthetic-monitor.py
      - name: Probe public failure boundaries
        run: python tests/p21-public-failure-matrix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p21-hourly-production-readiness
          path: |
            p21-hourly-monitor.json
            p21-public-failure-matrix.json
          retention-days: 14
