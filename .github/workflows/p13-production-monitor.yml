name: P13 Hourly Production Monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p13-hourly-monitor
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe production shell and Supabase Auth health
        run: python tests/p13-synthetic-monitor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p13-production-health
          path: p13-monitor.json
          retention-days: 14
