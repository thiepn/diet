name: P21 Hourly Production Readiness
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p21-hourly-monitor
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Probe current production release
        run: python tests/p13-synthetic-monitor.py
      - name: Probe public failure boundaries
        run: python tests/p21-public-failure-matrix.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p21-hourly-production-readiness
          path: |
            p21-hourly-monitor.json
            p21-public-failure-matrix.json
          retention-days: 14
