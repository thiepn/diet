name: P26 Steady-State Baseline

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p26-steady-state-baseline
  cancel-in-progress: true

jobs:
  steady-state-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify staged P26 contract
        run: node tests/p26-steady-state-contract.mjs
      - name: Capture activation readiness
        run: |
          node scripts/p26-activation-readiness.mjs --out p26-activation-readiness.json
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/p26-activation-readiness.mjs --require-ready --out p26-activation-readiness.json
          fi
      - name: Generate optimization triage
        run: node scripts/p26-optimization-triage.mjs --out p26-optimization-triage.json
      - name: Capture public steady-state sample
        run: python tests/p26-public-steady-state.py --out p26-public-steady-state.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p26-steady-state-${{ github.run_id }}
          path: |
            p26-activation-readiness.json
            p26-optimization-triage.json
            p26-public-steady-state.json
          if-no-files-found: error
          retention-days: 30
