name: P39 Refreeze Churn Reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform-p25-burn-in-plan.json'
      - 'platform-p29-*.json'
      - 'platform-p31-fleet-registry.json'
      - 'platform-p32-*.json'
      - 'platform-p39-refreeze-churn-plan.json'
      - '.well-known/thiepn-app.json'
      - 'supabase/backend.json'
      - 'scripts/p39-*.py'
      - 'tests/p39-*'
      - 'docs/P39-*.md'
      - '.github/workflows/p15-offsite-backup.yml'
      - '.github/workflows/p39-refreeze-churn.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p39-refreeze-churn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify P39 structural contract
        run: node tests/p39-refreeze-churn-contract.mjs

      - name: Verify P39 reconciliation and freshness negative paths
        run: python tests/p39-refreeze-churn-contract.py

      - name: Verify P39 CLI
        run: python scripts/p39-reconcile-refreeze-candidate.py --help > /dev/null

      - name: Build current blocked reconciliation receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p25=json.loads(Path('platform-p25-burn-in-plan.json').read_text())
          historical=json.loads(json.dumps(p25))
          historical.update({
            'state':'refreeze_pending','generation':4,'generationState':'invalidated_epoch_changed',
            'currentGenerationEligible':False,'nextGeneration':5
          })
          historical['pendingGeneration5'].update({
            'state':'waiting_quiet_window_and_fresh_backup','eligibleToActivate':False,
            'postFinalChangeEncryptedBackupVerified':False,'backupEvidenceRef':None,
            'lastDecision':'blocked'
          })
          Path('p39-historical-p25.json').write_text(json.dumps(historical,indent=2)+'\n')
          obs={'projectStatus':'ACTIVE_HEALTHY',**historical['pendingGeneration5']['candidateEpoch'],'migrationChangedAt':'2026-10-04T17:31:17Z'}
          backup={
            'runId':37218356705,'conclusion':'success','createdAt':'2026-10-04T16:52:34Z',
            'verificationPassed':True,'encrypted':True,'artifactAvailable':True,
            'artifactId':11309815027,
            'artifactDigest':'sha256:3c5acd5fca64f6dbed7df766eab0bd0c86fe61ee267d97d706e7e0ad25fae874',
            'evidenceRef':'github-actions:P15:37218356705:11309815027'
          }
          Path('p39-current-observation.json').write_text(json.dumps(obs,indent=2)+'\n')
          Path('p39-current-backup.json').write_text(json.dumps(backup,indent=2)+'\n')
          PY
          python scripts/p39-reconcile-refreeze-candidate.py             p39-current-observation.json p39-current-backup.json             --p25 p39-historical-p25.json --out-dir p39-current
          python - <<'PY'
          import json
          r=json.load(open('p39-current/p39-refreeze-reconcile-receipt.json'))
          assert r['decision']=='blocked'
          assert r['candidateRevision']==2
          assert r['backupFresh'] is False
          assert r['sourceFilesMutated'] is False
          assert r['productionMutationPerformed'] is False
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p39-refreeze-churn-${{ github.run_id }}
          path: |
            p39-historical-p25.json
            p39-current-observation.json
            p39-current-backup.json
            p39-current/p39-refreeze-reconcile-receipt.json
            p39-current/platform-p25-burn-in-plan.json
          if-no-files-found: error
          retention-days: 30
