name: Repair Diet CSS parse failure

on:
  push:
    paths:
      - '.github/workflows/repair-css-parse.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Repair malformed CSS and rotate web assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles/dashboard-02.css')
          s=p.read_text()
          if s.count('{') != s.count('}'):
              if s.count('{') == s.count('}') + 1:
                  s=s.rstrip()+'}\n'
              else:
                  raise SystemExit(f'Unexpected brace imbalance in {p}: {s.count("{")} opens / {s.count("}")} closes')
              p.write_text(s)
          for f in Path('src/styles').glob('*.css'):
              t=f.read_text()
              if t.count('{') != t.count('}'):
                  raise SystemExit(f'CSS brace imbalance remains in {f}: {t.count("{")} opens / {t.count("}")} closes')
          for name in ['index.html','sw.js','.github/workflows/ci.yml']:
              f=Path(name)
              t=f.read_text().replace('1.0.2-static1','1.0.2-static2')
              if name=='sw.js':
                  t=t.replace('diet-copilot-web-v1.0.2-static1','diet-copilot-web-v1.0.2-static2')
              f.write_text(t)
          PY
          node scripts/build-v68.mjs --write
          node --check diet-app.js
          python - <<'PY'
          from pathlib import Path
          css=Path('diet.css').read_text()
          if css.count('{') != css.count('}'):
              raise SystemExit('Production CSS is still brace-unbalanced')
          required=['.skip-link{','.desktop-sidebar,.p4-desktop-today-head','.desktop-brand-mark{width:40px;height:40px','.nav-icon svg{width:18px;height:18px}']
          for token in required:
              if token not in css:
                  raise SystemExit(f'Missing required CSS token: {token}')
          print('CSS parse repair verified')
          PY
          rm -f .github/workflows/repair-css-parse.yml
      - name: Commit repair
        run: |
          git config user.name 'thiepn'
          git config user.email 'junsosmart@gmail.com'
          git add -A
          git commit -m 'Fix Diet CSS parse failure and rotate web assets'
          git push origin HEAD:main
