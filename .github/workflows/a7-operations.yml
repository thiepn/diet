name: A7 / P21 Full Production Hardening Contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.well-known/thiepn-app.json'
      - 'v2/**'
      - 'sw.js'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - 'tests/p21-*'
      - '.github/workflows/a7-operations.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify P21 operations stack
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app=JSON.parse(fs.readFileSync('.well-known/thiepn-app.json','utf8'));
          const backend=JSON.parse(fs.readFileSync('supabase/backend.json','utf8'));
          const migration=fs.readFileSync('supabase/migrations/20260929224046_diet_p21_failure_incident_recovery_certification.sql','utf8');
          const browser=fs.readdirSync('v2',{recursive:true}).filter(p=>/\.(?:js|mjs)$/.test(String(p))).map(p=>fs.readFileSync('v2/'+p,'utf8')).join('\n');

          if(app.operationsVersion!=='P21.0'||app.incidentCertificationRelease!=='P21')throw new Error('Unexpected P21 metadata.');
          for(const [k,v] of Object.entries({securityRelease:'P14',resilienceRelease:'P15',performanceRelease:'P16',privacyRelease:'P17',integrityRelease:'P18',concurrencyRelease:'P19',changeGovernanceRelease:'P20'}))if(app[k]!==v)throw new Error('Prior release regressed: '+k);
          if(app.webRelease!=='2.0.3')throw new Error('P21 must not churn browser release.');
          if(backend.incident_response_policy?.failure_certification?.passed_count!==15||backend.incident_response_policy?.failure_certification?.failed_count!==0)throw new Error('P21 failure certification not green.');
          if(backend.incident_response_policy?.emergency_write_freeze?.current_writes_paused!==false)throw new Error('Unexpected production write freeze.');
          if(!migration.includes('Diet writes are temporarily paused for incident recovery')||!migration.includes('diet-p21-readiness-daily'))throw new Error('P21 write-freeze/readiness controls missing.');
          for(const name of ['diet_p21_set_write_freeze','diet_p21_run_failure_certification','diet_p21_incident_status'])if(browser.includes(name))throw new Error('P21 operator surface leaked into browser runtime: '+name);
          console.log('Diet P21 full production hardening contract passed.');
          NODE
