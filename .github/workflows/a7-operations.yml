name: A7 / P20 Full Operations Governance Contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.well-known/thiepn-app.json'
      - 'v2/**'
      - 'sw.js'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - 'tests/p20-*'
      - '.github/workflows/a7-operations.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify P20 operations stack
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app=JSON.parse(fs.readFileSync('.well-known/thiepn-app.json','utf8'));
          const backend=JSON.parse(fs.readFileSync('supabase/backend.json','utf8'));
          const migration=fs.readFileSync('supabase/migrations/20260929221452_diet_p20_schema_drift_release_governance.sql','utf8');
          const browser=fs.readdirSync('v2',{recursive:true}).filter(p=>/\.(?:js|mjs)$/.test(String(p))).map(p=>fs.readFileSync('v2/'+p,'utf8')).join('\n');

          if(app.operationsVersion!=='P20.0'||app.changeGovernanceRelease!=='P20')throw new Error('Unexpected P20 metadata.');
          for(const [k,v] of Object.entries({securityRelease:'P14',resilienceRelease:'P15',performanceRelease:'P16',privacyRelease:'P17',integrityRelease:'P18',concurrencyRelease:'P19'}))if(app[k]!==v)throw new Error('Prior release regressed: '+k);
          if(app.webRelease!=='2.0.3')throw new Error('P20 must not churn browser release.');
          if(backend.change_governance_policy?.checkpoint?.status!=='clean'||backend.change_governance_policy?.drift_audit?.auto_repair!==false)throw new Error('P20 governance unsafe.');
          if(!migration.includes('diet_p20_schema_fingerprint')||!migration.includes('diet-p20-schema-drift-daily')||!migration.includes('37 3 * * *'))throw new Error('P20 fingerprint/watchdog missing.');
          if(browser.includes('diet_p20_release_status')||browser.includes('diet_p20_certify_release'))throw new Error('P20 operations leaked into browser runtime.');
          console.log('Diet P20 full operations governance passed.');
          NODE
