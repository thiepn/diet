name: A7 Operations Contract

on:
  pull_request:
  push:
    branches: [main, v6.8-web-v1]

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify Web 1.0.2 static production runtime
        run: node scripts/build-v68.mjs
      - name: A7 diagnostics contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const operations=fs.readFileSync('src/operations/dashboard-ops.js','utf8');
          const bundle=fs.readFileSync('diet-app.js','utf8');
          const styles=fs.readFileSync('diet.css','utf8');
          const manifest=JSON.parse(fs.readFileSync('.well-known/thiepn-app.json','utf8'));
          const index=fs.readFileSync('index.html','utf8');
          if(manifest.app!=='diet'||manifest.operationsVersion!=='A7.1')throw new Error('Diet A7 metadata invalid.');
          if(manifest.degradedMode!=='cached-read-only')throw new Error('Diet degraded mode must preserve cached reads.');
          if(manifest.health?.networkFailureLogsOutUser!==false)throw new Error('Network failure must not become logout.');
          if(manifest.health?.writesPerformedByDashboard!==false)throw new Error('Dashboard must remain read-only.');
          if(manifest.webRelease!=='1.0.2'||manifest.releaseChannel!=='stable')throw new Error('Stable release metadata missing.');
          if(!index.includes('diet-app.js?v=1.0.2-static6')||!index.includes('diet.css?v=1.0.2-static6'))throw new Error('Web 1.0.2 static6 runtime is not loaded.');
          if(bundle.includes('{%')||styles.includes('{%')||bundle.startsWith('---')||styles.startsWith('---'))throw new Error('Production runtime contains unexpanded Jekyll/Liquid templates.');
          if(!bundle.includes('detectSessionInUrl: false')||!bundle.includes('dietReadWebOAuthCallback')||!bundle.includes('exchangeCodeForSession'))throw new Error('Explicit web PKCE session establishment is missing.');
          if(!bundle.includes('dietBackupBrowserPkceVerifier')||!bundle.includes('dietRestoreBrowserPkceVerifier')||!bundle.includes('dietPkceVerifierMissing'))throw new Error('Web PKCE verifier recovery is missing.');
          if(!operations.includes('window.DietOperations')||!bundle.includes('window.DietOperations'))throw new Error('Diet diagnostics surface missing from production runtime.');
          if(!bundle.includes('window.DietRelease')||!bundle.includes("DIET_RELEASE_CHANNEL = 'stable'"))throw new Error('Stable DietRelease surface missing.');
          for(const category of ["'network'","'authentication'","'authorization'","'rate_limit'","'service'"]){if(!operations.includes(category))throw new Error(`Missing failure category ${category}`)}
          if(operations.includes('localStorage.clear('))throw new Error('Operations must not broadly clear storage.');
          if(operations.includes('.auth.signOut('))throw new Error('Operations must not convert failures into sign-out.');
          console.log('Diet A7 operations contract passed inside Web 1.0.2 static6 runtime.');
          NODE
