name: A7 / P18 Operations, Security, Resilience, Performance, Privacy & Integrity Contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.well-known/thiepn-app.json'
      - 'v2/**'
      - 'sw.js'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - 'tests/p18-*'
      - '.github/workflows/a7-operations.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify P18 operations stack
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app=JSON.parse(fs.readFileSync('.well-known/thiepn-app.json','utf8'));
          const backend=JSON.parse(fs.readFileSync('supabase/backend.json','utf8'));
          const data=fs.readFileSync('v2/data.js','utf8');
          const settings=fs.readFileSync('v2/settings.js','utf8');
          const writes=fs.readFileSync('v2/write-api.mjs','utf8');
          const telemetry=fs.readFileSync('v2/telemetry.mjs','utf8');
          const migration=fs.readFileSync('supabase/migrations/20260929203937_diet_p18_integrity_watchdog_and_constraints.sql','utf8');

          if(app.operationsVersion!=='P18.0'||app.securityRelease!=='P14'||app.resilienceRelease!=='P15'||app.performanceRelease!=='P16'||app.privacyRelease!=='P17'||app.integrityRelease!=='P18')throw new Error('Unexpected release stack.');
          if(app.webRelease!=='2.0.3')throw new Error('P18 must not churn the browser release.');
          if(app.health?.databaseNutritionIntegrityConstraints!==true||app.health?.integrityWatchdog!==true||app.health?.integrityAutoRepair!==false)throw new Error('P18 integrity metadata missing.');
          if(backend.integrity_policy?.release!=='P18'||backend.integrity_policy?.watchdog?.service_only!==true||backend.integrity_policy?.auto_repair!==false)throw new Error('P18 backend integrity policy regressed.');
          if(backend.integrity_policy?.release_audit_status!=='clean'||backend.integrity_policy?.release_audit_failure_count!==0)throw new Error('P18 release audit is not clean.');
          if(!migration.includes("diet-p18-integrity-daily")||!migration.includes("17 3 * * *"))throw new Error('P18 scheduled watchdog missing.');
          if(data.includes('diet_p18_integrity_report')||settings.includes('diet_p18_integrity_report'))throw new Error('Global integrity report leaked into browser runtime.');
          if(!writes.includes('p_request_id')||!writes.includes('uncertainWrite'))throw new Error('Write reliability regressed.');
          if(telemetry.includes('sendBeacon(')||telemetry.includes('.rpc('))throw new Error('Local telemetry attempted remote transmission.');
          console.log('Diet P18 operations stack passed.');
          NODE
