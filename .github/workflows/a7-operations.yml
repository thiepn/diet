name: A7 / P25 Operations Contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.well-known/thiepn-app.json'
      - 'v2/**'
      - 'sw.js'
      - 'supply-chain.lock.json'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - 'scripts/p22-*'
      - 'tests/p22-*'
      - 'tests/p23-*'
      - 'tests/p24-*'
      - 'tests/p25-*'
      - 'platform-p24-pre-upgrade.json'
      - 'platform-p23-inventory.json'
      - 'platform-p25-burn-in-plan.json'
      - '.github/workflows/**'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify P25 operations stack
        run: |
          python scripts/p22-verify-supply-chain.py
          node tests/p23-platform-contract.mjs
          node tests/p24-execution-contract.mjs
          node tests/p25-burnin-contract.mjs
          python -m py_compile tests/p23-shared-platform-public.py tests/p24-preupgrade-public.py tests/p25-public-burnin.py
