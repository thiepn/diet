name: A7 / P16 Operations, Security, Resilience & Performance Contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.well-known/thiepn-app.json'
      - 'v2/**'
      - 'sw.js'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - 'tests/p16-*'
      - '.github/workflows/a7-operations.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify P16 operations stack
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app=JSON.parse(fs.readFileSync('.well-known/thiepn-app.json','utf8'));
          const backend=JSON.parse(fs.readFileSync('supabase/backend.json','utf8'));
          const data=fs.readFileSync('v2/data.js','utf8');
          const writes=fs.readFileSync('v2/write-api.mjs','utf8');
          const telemetry=fs.readFileSync('v2/telemetry.mjs','utf8');
          if(app.operationsVersion!=='P16.0'||app.securityRelease!=='P14'||app.resilienceRelease!=='P15'||app.performanceRelease!=='P16')throw new Error('Unexpected operations release stack.');
          if(app.health?.consolidatedOwnerRead!==true||app.health?.normalRefreshDataRequests!==1||app.health?.ownerFilteredRealtime!==true)throw new Error('P16 read metadata missing.');
          if(backend.performance_policy?.read_transport!=='diet_app_read_snapshot_security_invoker')throw new Error('P16 read transport regressed.');
          if(backend.security_policy?.anonymous_diet_access!==false||backend.resilience_policy?.destructive_restore_automatic!==false)throw new Error('Prior safety layers regressed.');
          if(!data.includes("client.rpc('diet_app_read_snapshot')")||!data.includes("state.readTransport='snapshot_rpc'"))throw new Error('Consolidated read path missing.');
          if(!writes.includes('p_request_id')||!writes.includes('uncertainWrite'))throw new Error('Write reliability regressed.');
          if(telemetry.includes('sendBeacon(')||telemetry.includes('.rpc('))throw new Error('Local telemetry attempted remote transmission.');
          console.log('Diet P16 operations stack passed.');
          NODE
