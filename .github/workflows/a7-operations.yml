name: A7 / P14 Operations & Security Contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.well-known/thiepn-app.json'
      - 'v2/**'
      - 'sw.js'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
      - '.github/workflows/a7-operations.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify P14 operations and security contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app=JSON.parse(fs.readFileSync('.well-known/thiepn-app.json','utf8'));
          const backend=JSON.parse(fs.readFileSync('supabase/backend.json','utf8'));
          const data=fs.readFileSync('v2/data.js','utf8');
          const guards=fs.readFileSync('v2/engine/release-guards.mjs','utf8');
          const writes=fs.readFileSync('v2/write-api.mjs','utf8');
          const telemetry=fs.readFileSync('v2/telemetry.mjs','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          if(app.operationsVersion!=='P14.0'||app.securityRelease!=='P14')throw new Error('Unexpected P14 operations/security contract.');
          if(app.degradedMode!=='cached-read-only'||app.health?.networkFailureLogsOutUser!==false)throw new Error('Degraded-mode contract regressed.');
          if(app.health?.writesPerformedByDashboard!==true||app.health?.writesRequireExplicitConfirmation!==true)throw new Error('Explicit-write metadata missing.');
          if(app.health?.databaseOwnerGuard!==true||app.health?.directTableWrites!==false||app.health?.anonymousDietAccess!==false)throw new Error('P14 security metadata missing.');
          if(backend.security_policy?.table_session_owner_guard!==true||backend.security_policy?.cross_owner_foreign_keys!==true||backend.security_policy?.private_helpers_exposed_to_browser!==false)throw new Error('P14 backend security policy regressed.');
          if(!data.includes('isDefinitiveAuthFailure')||!data.includes("setState('stale'")||!data.includes("setState('offline'"))throw new Error('Read recovery states regressed.');
          if(!guards.includes("return 'transient'"))throw new Error('Transient failure classification missing.');
          if(!writes.includes('p_request_id')||!writes.includes('uncertainWrite')||!writes.includes("recordTelemetry('write_retry'"))throw new Error('Write reliability instrumentation missing.');
          if(telemetry.includes('fetch(')||telemetry.includes('sendBeacon(')||telemetry.includes('.rpc('))throw new Error('Local telemetry attempted remote transmission.');
          if(sw.includes('localStorage.clear(')||data.includes('localStorage.clear('))throw new Error('Broad local data clearing is forbidden.');
          console.log('Diet P14 operations/security contract passed.');
          NODE
