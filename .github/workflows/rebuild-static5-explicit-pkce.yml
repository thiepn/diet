name: Rebuild Diet static5 explicit PKCE

on:
  push:
    paths:
      - '.github/workflows/rebuild-static5-explicit-pkce.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build explicit PKCE web runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-v68.mjs --write
          python - <<'PY'
          from pathlib import Path

          for name in ['index.html', 'sw.js', 'tests/release.mjs']:
              p = Path(name)
              s = p.read_text().replace('static4', 'static5')
              p.write_text(s)

          p = Path('tests/release.mjs')
          s = p.read_text()
          needle = "assert.ok(js.includes(\"flowType: 'pkce'\") || js.includes(\"flowType:'pkce'\"),'PKCE auth configuration missing');\n"
          addition = needle + "assert.ok(js.includes('detectSessionInUrl: false'),'Web PKCE callback must be exchanged explicitly');\nassert.ok(js.includes('dietReadWebOAuthCallback')&&js.includes('callback.code')&&js.includes('exchangeOptions'),'Explicit web PKCE callback exchange is missing');\n"
          if needle not in s:
              raise SystemExit('PKCE release assertion anchor missing')
          p.write_text(s.replace(needle, addition, 1))
          PY

          node --check diet-app.js
          node scripts/build-v68.mjs
          node tests/release.mjs
          grep -q "detectSessionInUrl: false" diet-app.js
          grep -q "dietReadWebOAuthCallback" diet-app.js
          grep -q "callback.code" diet-app.js
          grep -q "diet-app.js?v=1.0.2-static5" index.html
          grep -q "diet-copilot-web-v1.0.2-static5" sw.js

      - name: Commit explicit PKCE web release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thiepn'
          git config user.email 'junsosmart@gmail.com'
          git add diet-app.js index.html sw.js tests/release.mjs
          git commit -m 'Ship explicit web PKCE exchange in static5'
          git push origin HEAD:main
