name: Export Android manifest inspector

on:
  push:
    paths:
      - '.github/workflows/export-aapt2.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android SDK aapt2
        shell: bash
        run: |
          set -euo pipefail
          tool="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -print | sort -V | tail -1)"
          test -n "$tool"
          mkdir -p /tmp/aapt2-tool/lib
          cp "$tool" /tmp/aapt2-tool/aapt2
          chmod +x /tmp/aapt2-tool/aapt2
          while read -r dep; do
            [ -f "$dep" ] && cp "$dep" "/tmp/aapt2-tool/lib/$(basename "$dep")"
          done < <(ldd "$tool" | awk '{if ($3 ~ /^\//) print $3}')
          LD_LIBRARY_PATH=/tmp/aapt2-tool/lib "$tool" version
      - uses: actions/upload-artifact@v4
        with:
          name: android-aapt2
          path: /tmp/aapt2-tool
          if-no-files-found: error
          retention-days: 1
