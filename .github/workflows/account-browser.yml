name: Account Browser Regression (V1 fallback)
on:
  pull_request:
    branches: [v6.8-web-v1]
  push:
    branches: [v6.8-web-v1]
permissions:
  contents: read
concurrency:
  group: account-browser-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned browser test tooling
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: V1 account lifecycle regression
        run: python tests/account-browser.py --browser ${{ matrix.browser }} --root _site --out account-results/${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-browser-v1-${{ matrix.browser }}
          path: account-results/
          retention-days: 7
