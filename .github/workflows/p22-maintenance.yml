name: P22 Long-Term Maintenance & Supply Chain
on:
  push:
    branches: [main]
    paths:
      - 'supply-chain.lock.json'
      - 'vendor/**'
      - 'scripts/p22-*'
      - 'tests/p22-*'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - '.well-known/thiepn-app.json'
      - 'supabase/backend.json'
      - 'supabase/migrations/**'
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p22-maintenance-supply-chain
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify immutable supply-chain contract
        run: |
          python scripts/p22-verify-supply-chain.py --out p22-supply-chain-evidence.json
          node tests/p22-maintenance-contract.mjs
      - name: Verify live production baseline
        run: |
          python tests/p13-synthetic-monitor.py
          python tests/p21-public-failure-matrix.py
      - name: Check upstream versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/p22-upstream-watch.py --out p22-upstream-watch.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: p22-maintenance-evidence
          path: |
            p22-supply-chain-evidence.json
            p22-upstream-watch.json
            p21-hourly-monitor.json
            p21-public-failure-matrix.json
          retention-days: 30
