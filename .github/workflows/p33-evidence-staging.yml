name: P33 Evidence and Provenance

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform-p2*.json'
      - 'platform-p3*.json'
      - 'platform-p33-audit-ledger.jsonl'
      - 'scripts/p2*.py'
      - 'scripts/p3*.py'
      - 'contracts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p33-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify P33 structural contract
        run: node tests/p33-evidence-contract.mjs
      - name: Verify P33 ledger/provenance negative paths
        run: python tests/p33-evidence-contract.py
      - name: Verify canonical anchored ledger
        run: python scripts/p33-ledger.py verify platform-p33-audit-ledger.jsonl --anchor platform-p33-ledger-anchor.json --out p33-ledger-verification.json
      - name: Build P32 governance provenance pack
        shell: bash
        run: |
          cat > p33-provenance-manifest.json <<'JSON'
          {
            "changeId":"p32-policy-as-code-admission",
            "subject":"Merged P32 policy-as-code governance phase",
            "git":{"repository":"thiepn/diet","commitSha":"0e7e48c57cc505ec0d42dcc706e364763b8e8c63","pullRequest":23},
            "workflows":[
              {"name":"CI","runId":37123067111,"runNumber":784,"conclusion":"success"},
              {"name":"P32 Change Admission Warn","runId":37123067138,"runNumber":1,"conclusion":"success"},
              {"name":"A7 / P25 Operations Contract","runId":37123067132,"runNumber":456,"conclusion":"success"}
            ],
            "chainRefs":{
              "p29MergeSha":"2c1bd74dfab8c45425054e552ba92bc65713c6b5",
              "p30MergeSha":"dd35a66826471b4cd94c1b9e8ead90be18dc1dc5",
              "p31MergeSha":"fd0f541fef82539c75ce3c4b429a222b4a20663f",
              "p32MergeSha":"0e7e48c57cc505ec0d42dcc706e364763b8e8c63"
            },
            "liveAttestation":{
              "observedAt":"2026-10-03T21:52:18.112063Z",
              "projectStatus":"ACTIVE_HEALTHY",
              "migrationHead":"20261003202015",
              "migrationName":"hub_h12_h13_notes_projection",
              "semanticSchemaSha256":"5b7b1caddef09b97f59c85d79d04eabfbe55120fe1754340a7367c1b14d39375",
              "gomokuRoomVersion":48,
              "cronJobs":14
            },
            "approvals":[{"type":"operator_override","scope":"engineering_phase_progression","productionApproval":false}],
            "privacy":{"containsRawSecrets":false,"containsRawPersonalAuditData":false,"containsRawNetworkIdentifiers":false},
            "ledgerPath":"platform-p33-audit-ledger.jsonl",
            "ledgerAnchorPath":"platform-p33-ledger-anchor.json",
            "requiredArtifacts":[
              {"name":"p29-dependency-graph","path":"platform-p29-dependency-graph.json","kind":"dependency-graph","sourceClass":"derived_policy"},
              {"name":"p30-release-plan","path":"platform-p30-release-train-plan.json","kind":"release-plan","sourceClass":"derived_policy"},
              {"name":"p31-fleet-registry","path":"platform-p31-fleet-registry.json","kind":"fleet-registry","sourceClass":"derived_policy"},
              {"name":"p31-release-registry","path":"platform-p31-release-registry.json","kind":"release-registry","sourceClass":"derived_policy"},
              {"name":"p32-admission-plan","path":"platform-p32-change-admission-plan.json","kind":"policy-plan","sourceClass":"derived_policy"},
              {"name":"p32-policy-bundle","path":"platform-p32-policy-bundle.json","kind":"policy-bundle","sourceClass":"derived_policy"}
            ]
          }
          JSON
          python scripts/p33-build-provenance.py p33-provenance-manifest.json --out p33-p32-provenance-pack.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p33-evidence-${{ github.run_id }}
          path: |
            p33-ledger-verification.json
            p33-p32-provenance-pack.json
          if-no-files-found: error
          retention-days: 90
