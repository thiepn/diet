name: P40 Generation-5 Activation and Burn-In Start

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform-p25-burn-in-plan.json'
      - 'platform-p26-steady-state-plan.json'
      - 'platform-p29-release-orchestration-plan.json'
      - 'platform-p31-fleet-registry.json'
      - 'platform-p32-*.json'
      - 'platform-p37-*.json'
      - 'platform-p38-*.json'
      - 'platform-p39-*.json'
      - 'platform-p40-*.json'
      - '.well-known/thiepn-app.json'
      - 'supabase/backend.json'
      - 'tests/p40-*'
      - 'docs/P40-*.md'
      - '.github/workflows/p40-generation5-activation.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p40-generation5-activation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify P40 structural activation contract
        run: node tests/p40-generation5-activation-contract.mjs

      - name: Verify P40 receipt integrity and replay protection
        run: python tests/p40-generation5-activation-contract.py

      - name: Verify active P25 probe syntax
        run: python -m py_compile tests/p25-public-burnin.py scripts/p37-evaluate-refreeze.py scripts/p38-activate-generation5.py scripts/p38-burnin-progress.py

      - name: Confirm activation remains repository-only
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('platform-p40-generation5-activation-plan.json'))
          r=json.load(open('platform-p40-generation5-activation-receipt.json'))
          assert p['state']=='generation5_burn_in_active'
          assert p['currentState']['burnInCertified'] is False
          assert p['currentState']['oeStarted'] is False
          assert r['productionMutationPerformed'] is False
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p40-generation5-activation-${{ github.run_id }}
          path: |
            platform-p40-live-refreeze-observation.json
            platform-p40-refreeze-decision.json
            platform-p40-generation5-activation-receipt.json
            platform-p40-generation5-activation-plan.json
          if-no-files-found: error
          retention-days: 90
