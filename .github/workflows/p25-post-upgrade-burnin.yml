name: P25 Post-Upgrade Burn-In

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p25-post-upgrade-burn-in
  cancel-in-progress: true

jobs:
  public-burn-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Capture public P25 health sample
        run: python tests/p25-public-burnin.py --out p25-public-burnin.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p25-burnin-${{ github.run_id }}
          path: p25-public-burnin.json
          if-no-files-found: error
          retention-days: 30
