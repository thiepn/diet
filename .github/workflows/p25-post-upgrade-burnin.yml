name: P25 Post-Upgrade Burn-In

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '7,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p25-post-upgrade-burn-in
  cancel-in-progress: true

jobs:
  public-burn-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Capture public P25 health sample
        run: python tests/p25-public-burnin.py --out p25-public-burnin.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: p25-burnin-${{ github.run_id }}
          path: p25-public-burnin.json
          if-no-files-found: error
          retention-days: 30
