name: Platform P7 live Vercel probe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Verify client performance guards
        run: |
          node tests/p16-performance-contract.mjs
          node tests/p34-mobile-pwa-contract.mjs
          node tests/p35-visual-delight-contract.mjs

      - name: Verify P7 source contracts
        run: |
          npm install --prefix api --ignore-scripts --no-audit --no-fund
          node tests/platform-p7-vercel-runtime-contract.mjs
          node tests/platform-p7-vercel-runtime-unit.mjs

      - name: Build Pages candidate
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Verify Pages candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/v2/copilot.js
          test -f _site/v2/server-runtime.mjs
          grep -q 'active:"vercel"' _site/v2/server-runtime.mjs
          grep -q 'thiepn-diet.vercel.app/api/copilot' _site/v2/server-runtime.mjs

      - name: Verify live health
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error https://thiepn-diet.vercel.app/api/health)"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if(!x.ok) throw new Error("health ok=false");
            if(!x.ready) throw new Error("health ready=false");
            if(x.runtime!=="vercel") throw new Error("wrong runtime");
            if(x.region!=="dub1") throw new Error("wrong region: "+x.region);
            if(!x.configuration?.supabase) throw new Error("Supabase not configured");
            if(!x.configuration?.provider) throw new Error("AI provider not configured");
          ' "$health"

      - name: Verify authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/p7-unauth.json --write-out '%{http_code}'             -X POST https://thiepn-diet.vercel.app/api/copilot             -H 'content-type: application/json'             -H 'origin: https://thiepn.dev'             --data '{"question":"status","context":{},"history":[]}')"
          test "$code" = "401"
          node -e 'const x=require("/tmp/p7-unauth.json"); if(x.error!=="unauthorized") process.exit(1)'

      - name: Verify CORS boundary
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          code="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}'             -X OPTIONS https://thiepn-diet.vercel.app/api/copilot             -H 'origin: https://thiepn.dev')"
          test "$code" = "204"
          grep -qi '^access-control-allow-origin: https://thiepn.dev' "$headers"

          denied="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}'             -X OPTIONS https://thiepn-diet.vercel.app/api/copilot             -H 'origin: https://evil.example')"
          test "$denied" = "403"
