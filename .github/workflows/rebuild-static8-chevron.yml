name: Rebuild Diet static8 chevron hotfix

on:
  push:
    paths:
      - '.github/workflows/rebuild-static8-chevron.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build static8 web runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-v68.mjs --write
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'sw.js', 'tests/release.mjs']:
              p = Path(name)
              s = p.read_text().replace('static7', 'static8')
              p.write_text(s)
          p = Path('tests/release.mjs')
          s = p.read_text()
          anchor = "assert.equal((css.match(/{/g)||[]).length,(css.match(/}/g)||[]).length,'Production CSS braces are unbalanced');\n"
          guard = "assert.ok(css.includes('.v53-open-indicator{display:none!important}'),'V6.1.1 redundant card-chevron hotfix is missing');\n"
          if guard not in s:
              if anchor not in s: raise SystemExit('CSS release assertion anchor missing')
              s = s.replace(anchor, anchor + guard, 1)
          p.write_text(s)
          PY

          node --check diet-app.js
          node scripts/build-v68.mjs
          node tests/release.mjs
          grep -Fq '.v53-open-indicator{display:none!important}' diet.css
          grep -q 'diet-app.js?v=1.0.2-static8' index.html
          grep -q 'diet.css?v=1.0.2-static8' index.html
          grep -q 'diet-copilot-web-v1.0.2-static8' sw.js

      - name: Commit static8 web release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'thiepn'
          git config user.email 'junsosmart@gmail.com'
          git add diet.css diet-app.js index.html sw.js tests/release.mjs
          git commit -m 'Ship restored card affordances in static8'
          git push origin HEAD:main
