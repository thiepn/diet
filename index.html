<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e0c" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="description" content="Diet Copilot — a read-only nutrition and weight dashboard written by ChatGPT." />
  <title>Diet Copilot</title>
  <link rel="stylesheet" href="dashboard-01.css?v=3.1.1" />
  <link rel="stylesheet" href="dashboard-02.css?v=3.1.1" />
  <link rel="stylesheet" href="dashboard-03.css?v=3.1.1" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-wrap">
        <p class="eyebrow" id="dateLabel">Today</p>
        <div class="brand-row"><h1>Diet Copilot</h1><span class="readonly-badge">READ ONLY</span></div>
      </div>
      <div class="top-actions">
        <button class="status-pill" id="statusBtn" type="button" aria-label="Open connection settings"><span class="status-dot" id="statusDot"></span><span id="statusText">Local cache</span></button>
        <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh dashboard" title="Refresh">↻</button>
      </div>
    </header>
    <main id="app" class="content"></main>
    <nav class="bottom-nav" aria-label="Dashboard navigation">
      <button class="nav-item active" data-view="today" aria-current="page"><span>●</span><small>Today</small></button>
      <button class="nav-item" data-view="history"><span>◷</span><small>History</small></button>
      <button class="nav-item" data-view="trends"><span>↗</span><small>Trends</small></button>
      <button class="nav-item" data-view="insights"><span>◇</span><small>Insights</small></button>
    </nav>
  </div>
  <dialog id="connectionDialog" class="modal"><div class="modal-card"><div class="modal-head"><div><p class="eyebrow">Private data connection</p><h2>Dashboard connection</h2></div><button class="icon-btn" id="closeConnectionBtn" type="button" aria-label="Close">×</button></div><div id="connectionContent"></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="dashboard-config.js?v=3.1.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
  <script src="dashboard-01.js?v=3.1.1"></script>
  <script src="dashboard-02.js?v=3.1.1"></script>
  <script src="dashboard-03.js?v=3.1.1"></script>
  <script src="dashboard-04.js?v=3.1.1"></script>
</body>
</html>
