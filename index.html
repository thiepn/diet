<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FA" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="description" content="Diet Copilot — your personal nutrition, meal and body-weight history, logged through ChatGPT." />
  <title>Diet Copilot</title>
  <link rel="stylesheet" href="dashboard-01.css?v=4.0-p3" />
  <link rel="stylesheet" href="dashboard-02.css?v=4.0-p3" />
  <link rel="stylesheet" href="dashboard-03.css?v=4.0-p3" />
  <link rel="stylesheet" href="dashboard-p2.css?v=4.0-p3" />
  <link rel="stylesheet" href="dashboard-p3.css?v=4.0-p3" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-wrap">
        <p class="eyebrow" id="dateLabel">Today</p>
        <div class="brand-row"><h1>Diet Copilot</h1></div>
      </div>
      <div class="top-actions">
        <button class="status-pill" id="statusBtn" type="button" aria-label="Open account settings">
          <span class="status-dot" id="statusDot" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <span id="statusText">Sign in</span>
        </button>
        <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh dashboard" title="Refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M6.1 9A7 7 0 0 1 18.4 6.4L20 8"/><path d="M17.9 15A7 7 0 0 1 5.6 17.6L4 16"/></svg>
        </button>
      </div>
    </header>
    <main id="app" class="content"></main>
    <nav class="bottom-nav" aria-label="Dashboard navigation">
      <button class="nav-item active" data-view="today" aria-current="page">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg></span><small>Today</small>
      </button>
      <button class="nav-item" data-view="history">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg></span><small>History</small>
      </button>
      <button class="nav-item" data-view="trends">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 4-4 3 3 5-7"/></svg></span><small>Trends</small>
      </button>
      <button class="nav-item" data-view="insights">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1-4.1-1.4 4.1-1.4L12 3Z"/><path d="m18 14 .8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8L18 14Z"/></svg></span><small>Insights</small>
      </button>
    </nav>
  </div>
  <dialog id="connectionDialog" class="modal"><div class="modal-card"><div class="modal-head"><div><p class="eyebrow">Diet Copilot</p><h2>Account</h2></div><button class="icon-btn" id="closeConnectionBtn" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="connectionContent"></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
  <script src="dashboard-01.js?v=4.0-p3"></script>
  <script src="dashboard-02.js?v=4.0-p3"></script>
  <script src="dashboard-p2.js?v=4.0-p3"></script>
  <script src="dashboard-p2-session.js?v=4.0-p3"></script>
  <script src="dashboard-p3.js?v=4.0-p3"></script>
  <script src="dashboard-03.js?v=4.0-p3"></script>
  <script src="dashboard-auth.js?v=4.0-p3"></script>
  <script src="dashboard-04.js?v=4.0-p3"></script>
</body>
</html>
