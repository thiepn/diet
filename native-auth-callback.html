<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex,nofollow" />
<title>Returning to Diet Copilot</title>
<style>
  :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f7f8fa; color:#1c2024; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; }
  main { width:min(420px,100%); background:#fff; border:1px solid #e4e7eb; border-radius:18px; padding:28px; box-shadow:0 16px 45px rgba(25,30,35,.08); }
  h1 { margin:0 0 8px; font-size:22px; letter-spacing:-.02em; }
  p { margin:0; color:#626b74; line-height:1.5; }
  a { display:block; margin-top:22px; padding:12px 16px; border-radius:10px; background:#1f6f50; color:#fff; text-decoration:none; font-weight:700; text-align:center; }
  small { display:block; margin-top:14px; color:#7a838c; line-height:1.45; }
</style>
</head>
<body>
<main>
  <h1>Returning to Diet Copilot</h1>
  <p id="status">Completing Google sign-in…</p>
  <a id="openApp" href="dev.thiepn.diet://auth-callback/">Open Diet Copilot</a>
  <small>If the app does not open automatically, tap the button above.</small>
</main>
<script>
(() => {
  const source = new URL(window.location.href);
  const target = new URL('dev.thiepn.diet://auth-callback/');
  const allowed = ['code', 'error', 'error_description', 'error_code', 'sb_flow_id'];
  let hasAuthResult = false;

  for (const key of allowed) {
    const value = source.searchParams.get(key);
    if (value !== null) {
      target.searchParams.set(key, value);
      hasAuthResult = true;
    }
  }

  const button = document.getElementById('openApp');
  const status = document.getElementById('status');

  if (!hasAuthResult) {
    status.textContent = 'The authentication response is missing. Return to Diet Copilot and try again.';
    button.hidden = true;
    return;
  }

  const deepLink = target.toString();
  button.href = deepLink;

  // Remove the one-time authorization code from browser history before handing
  // control back to Android. The code remains only in the in-memory deep link.
  try { history.replaceState(null, '', source.pathname); } catch {}

  try { window.location.replace(deepLink); } catch {}
})();
</script>
</body>
</html>
