<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex,nofollow" />
<title>Returning to Diet Copilot</title>
<style>
  :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fa;color:#1c2024}
  *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(440px,100%);background:#fff;border:1px solid #e4e7eb;border-radius:18px;padding:28px;box-shadow:0 16px 45px rgba(25,30,35,.08)}h1{margin:0 0 8px;font-size:22px;letter-spacing:-.02em}p{margin:0;color:#626b74;line-height:1.5}a{display:inline-block;margin-top:20px;color:#1f6f50;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Returning to Diet Copilot</h1>
  <p>Finishing your Google sign-in…</p>
  <a href="/diet/">Return to Diet Copilot</a>
</main>
<script>
(() => {
  const FLOW_KEY='diet-copilot:oauth-flow-v2';
  const TARGET_KEY='diet-copilot:oauth-target-v2';
  const source=new URL(location.href);
  const target=new URL('/diet/',source.origin);
  for(const key of ['code','sb_flow_id','error','error_code','error_description']){
    const value=source.searchParams.get(key);
    if(value!==null)target.searchParams.set(key,value);
  }
  if(!target.searchParams.has('sb_flow_id')){
    try{
      const stored=sessionStorage.getItem(FLOW_KEY);
      if(stored)target.searchParams.set('sb_flow_id',stored);
    }catch{}
  }
  try{
    sessionStorage.removeItem(TARGET_KEY);
    sessionStorage.removeItem(FLOW_KEY);
    history.replaceState(null,'',location.pathname);
  }catch{}
  location.replace(target.href);
})();
</script>
</body>
</html>
