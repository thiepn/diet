<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex,nofollow" />
<title>Signing in to Diet Copilot</title>
<style>
  :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fa;color:#1c2024}
  *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(440px,100%);background:#fff;border:1px solid #e4e7eb;border-radius:18px;padding:28px;box-shadow:0 16px 45px rgba(25,30,35,.08)}h1{margin:0 0 8px;font-size:22px;letter-spacing:-.02em}p{margin:0;color:#626b74;line-height:1.5}a{display:inline-block;margin-top:20px;color:#1f6f50;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Signing in to Diet Copilot</h1>
  <p id="status">Finishing your Google sign-in…</p>
  <a id="retry" href="/diet/" hidden>Return to Diet Copilot</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
(async () => {
  const PROJECT_URL='https://hycegznamzjhwinegaai.supabase.co';
  const PUBLISHABLE_KEY='sb_publishable_1rZzRPzfLMaAH5pIgCwIjA_19UPMIsR';
  const STORAGE_KEY='sb-hycegznamzjhwinegaai-auth-token';
  const TARGET_KEY='diet-copilot:oauth-target-v2';
  const FLOW_KEY='diet-copilot:oauth-flow-v2';
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  const params=new URLSearchParams(location.search);

  const fail=(message)=>{
    status.textContent=message;
    retry.hidden=false;
  };

  const authError=params.get('error_description')||params.get('error');
  if(authError){
    try{history.replaceState(null,'',location.pathname)}catch{}
    fail(`Google sign-in failed: ${authError}`);
    return;
  }

  const code=params.get('code');
  if(!code){
    fail('Google sign-in returned without an authorization code.');
    return;
  }

  if(!window.supabase?.createClient){
    fail('The sign-in service could not load. Check your connection and try again.');
    return;
  }

  try{
    const client=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,{
      auth:{
        flowType:'pkce',
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:false,
        storageKey:STORAGE_KEY
      }
    });
    const flowId=params.get('sb_flow_id');
    const {data,error}=await client.auth.exchangeCodeForSession(code,flowId?{flowId}:undefined);
    if(error)throw error;
    if(!data?.session?.user)throw new Error('No signed-in session was created.');

    try{
      sessionStorage.removeItem(TARGET_KEY);
      sessionStorage.removeItem(FLOW_KEY);
      history.replaceState(null,'',location.pathname);
    }catch{}
    location.replace('/diet/');
  }catch(error){
    try{history.replaceState(null,'',location.pathname)}catch{}
    fail(`Google sign-in could not be completed: ${error?.message||String(error)}`);
  }
})();
</script>
</body>
</html>
